# formats/spaceheat_name.yaml
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/formats/spaceheat-name"

title: "SpaceheatName"
description: |
  Names of actors within a spaceheat system.
  Lowercase alphanumeric starting with alphabet, plus hyphens, no spaces.
  
type: string
pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$"
minLength: 1
maxLength: 64

examples:
  - "scada"
  - "tank1-depth2"

  
# GridWorks metadata
x-gridworks:
  owner: "gridworks-energy"
  use_cases: ["SpaceheatNode Name", "DataChannel Name"]
