$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/enums/sh.actor.class"

# For comprehensive ASL documentation, see: https://gridworks-asl.readthedocs.io/
title: "sh.actor.class"
type: "string"
description: "Determines the code running Spaceheat Nodes supervised by Spaceheat SCADA software"

enum:
  - "NoActor"
  - "Scada"
  - "HomeAlone"
  - "BooleanActuator"
  - "PowerMeter"
  - "Atn"
  - "SimpleSensor"
  - "MultipurposeSensor"
  - "Thermostat"
  - "HubitatTelemetryReader"
  - "HubitatTankModule"
  - "HubitatPoller"
  - "I2cRelayMultiplexer"
  - "FlowTotalizer"
  - "Relay"
  - "Admin"
  - "Fsm"
  - "Parentless"
  - "Hubitat"
  - "HoneywellThermostat"
  - "ApiTankModule"
  - "ApiFlowModule"
  - "PicoCycler"
  - "I2cDfrMultiplexer"
  - "ZeroTenOutputer"
  - "AtomicAlly"
  - "SynthGenerator"
  - "FakeAtn"
  - "PumpDoctor"
  - "StratBoss"
  - "HpRelayBoss"
  - "SiegLoop"
  - "HpBoss"

default: "NoActor"

x-gridworks:
  owner: "gridworks-energy"
  version: "007"
  value_descriptions:
    "NoActor": "A SpaceheatNode that does not have any code running on its behalf within the SCADA, but is instead only a reference object (for example, a tank of hot water or a resistive element) that can be discussed (for example, the power drawn by the resistive element can be measured) or evaluated (for example, a set of 5 different temperatures in different places on the tank can be used to estimate total thermal energy in the tank)."
    "Scada": "The SCADA actor is the prime piece of code running and supervising other ProActors within the SCADA code. It is also responsible for managing the state of TalkingWith the AtomicTNode, as well maintaining and reporting a boolean state variable that indicates whether it is following dispatch commands from the AtomicTNode XOR following dispatch commands from its own HomeAlone actor."
    "HomeAlone": "HomeAlone is an abstract Spaceheat Actor responsible for dispatching the SCADA when it is not talking with the AtomicTNode."
    "BooleanActuator": "A SpaceheatNode representing a generic boolean actuator capable of turning on (closing a circuit) or turning off (opening a circuit). If the device is a relay that can be directly energized or de-energized, recommend using Relay actor instead."
    "PowerMeter": "A SpaceheatNode representing the power meter that is used to settle financial transactions with the TerminalAsset. That is, this is the power meter whose accuracy is certified in the creation of the TerminalAsset GNode via creation of the TaDeed."
    "Atn": "A SpaceheatNode representing the AtomicTNode. Note that the code running the AtomicTNode is not local within the SCADA code, except for a stub used for testing purposes."
    "SimpleSensor": "A SpaceheatNode representing a sensor that measures a single category of quantity (for example, temperature) for a single object (for example, on a pipe)."
    "MultipurposeSensor": "A sensor that either reads multiple kinds of readings from the same sensing device (for example reads current and voltage), reads multiple different objects (temperature from two different thermisters) or both."
    "Thermostat": "A SpaceheatNode representing a thermostat."
    "HubitatTelemetryReader": "A generic actor for reading telemetry data from a Hubitat Home Automation Hub LAN API."
    "HubitatTankModule": "The actor for running a GridWorks TankModule, comprised of two Z-Wave Fibaro temp sensors built together inside a small container that has 4 thermistors attached. These are designed to be installed from top (1) to bottom (4) on a stratified thermal storage tank."
    "HubitatPoller": "An actor for representing a somewhat generic ShNode (like a thermostat) that can be polled through the Hubitat."
    "I2cRelayMultiplexer": "Responsible for maintaining a single i2c bus object"
    "FlowTotalizer": "Attached to a driver that reads liquid flow by counting pulses from a flow meter that creates pulses and integrating the result (known as a totalizer in the industry)."
    "Relay": "An actor representing a relay. If the device is indeed relay that can be directly energized or de-energized, recommend using Relay instead of BooleanActuator"
    "Admin": "Actor for taking control of all of the actuators - flattening the hierarchy and disabling all finite state machines."
    "Fsm": "Actor Class for Finite State Machine actors. For these actors, the code is determined by the ShNode Name instead of just the ActorClass."
    "Parentless": "An actor that has no parent and is also not the primary SCADA. Used when there are multiple devices in the SCADA's system. For example, two Pis - one running the primary SCADA code and temp sensors, the other running relays and 0-10V output devices. A Parentless actor on the second Pi is responsible for spinning up the relay- and 0-10V output actors."
    "Hubitat": "An actor for representing a Hubitat for receiving Hubitat events over HTTP."
    "HoneywellThermostat": "An actor for representing a Honeywell Hubitat thermostat which can load thermostat heating state change messages into status reports."
    "ApiTankModule": "ApiTankModule value"
    "ApiFlowModule": "ApiFlowModule value"
    "PicoCycler": "PicoCycler value"
    "I2cDfrMultiplexer": "I2cDfrMultiplexer value"
    "ZeroTenOutputer": "ZeroTenOutputer value"
    "AtomicAlly": "Direct report of Atn when the Scada is in Atn mode."
    "SynthGenerator": "SynthGenerator value"
    "FakeAtn": "FakeAtn value"
    "PumpDoctor": "An actor that monitors and resets pumps if necessary"
    "StratBoss": "Protects thermal stratification during heat pump transitions"
    "HpRelayBoss": "Responsible for deciding when to close and open the HpScadaOps relay"
    "SiegLoop": "SiegLoop value"
    "HpBoss": "HpBoss value"
