x-gridworks:
  owner: "gridworks-energy"
  version: "004"
  value_descriptions:
    "UnknownMake__UnknownModel": "UnknownMake__UnknownModel value"
    "Egauge__4030": "A power meter in Egauge's 403x line."
    "NCD__PR8-14-SPST": "NCD's 4-channel high-power relay controller + 4 GPIO with I2C interface."
    "Adafruit__642": "Adafruit's high-temp, water-proof 1-wire temp sensor."
    "GridWorks__TSnap1": "Actual GridWorks TSnap 1.0 SCADA Box."
    "GridWorks__WaterTempHighPrecision": "PlaceHolder for some new GridWorks designed device."
    "Gridworks__SimPm1": "Simulated power meter."
    "SchneiderElectric__Iem3455": "Schneider Electric IEM 344 utility meter."
    "GridWorks__SimBool30AmpRelay": "Simulated relay."
    "OpenEnergy__EmonPi": "Open Energy's open source multipurpose sensing device (including internal power meter)."
    "GridWorks__SimTSnap1": "Simulated SCADA Box."
    "Atlas__EzFlo": "Atlas Scientific EZO Embedded Flow Meter Totalizer, pulse to I2C."
    "Hubitat__C7__LAN1": "This refers to a Hubitat C7 that has been configured in a specific way with respect to the APIs it presents on the Local Area Network. The Hubitat C7 is a home automation hub that supports building ZigBee and ZWave meshes, plugs into Ethernet, has a reasonable user interface and has an active community of open-source developers who create drivers and package managers for devices, and supports the creation of various types of APIs on the Local Area Network."
    "GridWorks__Tank_Module_1": "This refers to a small module designed and assembled by GridWorks that is meant to be mounted to the side of a hot water tank. It requires 24V DC and has 4 temperature sensors coming out of it labeled 1, 2, 3 and 4. It is meant to provide temperature readings (taken within a half a second of each other) of all 4 of its sensors once a minute."
    "Fibaro__Analog_Temp_Sensor": "This enum refers to a Fibaro FGBS-222 home automation device that has been configured in a specific way. This includes (1) being attached to two 10K NTC thermistors and a specific voltage divider circuit that specifies its temperature as a function of voltage and (2) one of its potential free outputs being in-line with the power of a partner Fibaro, so that it can power cycle its partner (because there are reports of Fibaros no longer reporting temp change after weeks or months until power cylced). The Fibaro itself is a tiny (29 X 18 X 13 mm) Z-Wave device powered on 9-30V DC that can read up to 6 1-wire DS18B20 temp sensors, 2 0-10V analog inputs and also has 2 potential free outputs."
    "Amphenol__NTC_10K_Thermistor_MA100GG103BN": "A small gauge, low-cost, rapid response NTC 10K Thermistor designed for medical applications."
    "YHDC__SCT013-100": "YHDC current transformer."
    "Magnelab__SCT-0300-050": "Magnelab 50A current transformer."
    "GridWorks__MultiTemp1": "GridWorks ADS 1115-based analog temperature sensor that has 12 channels (labeled 1-12) to read 12 10K NTC Thermistors. It is comprised of 3 NCD ADS 1115 I2C temperature sensors with I2C Addresses 0x4b, 0x48, 0x49."
    "Krida__Emr16-I2c-V3": "16-Channel I2C Low Voltage Electromagnetic Relay Board."
    "Omega__FTB8007HW-PT": "A double-jet reed pulse producing Flow Meter with 3/4" pipe, one pulse per 1/10th of a gallon."
    "Istec_4440": "A double-jet reed pulse producing Flow Meter with 3/4" pipe, somewhat strange pulse output."
    "Omega__FTB8010HW-PT": "A double-jet reed pulse producingFlow Meter with 1" pipe, one pulse per gallon. Rated for water to 195F."
    "Belimo__BallValve232VS": "Belimo Ball Valve. Configurable to be either normally open or normally closed. Goes into its powered position over about a minute and winds up a spring as it does that. Moves back to un-powered position in about 20 seconds,"
    "Belimo__DiverterB332L": "Belimo 3-way diverter valve, 1.25", 24 VAC, spring return actuator."
    "Taco__0034ePLUS": "Taco 0034ePLUS 010V controllable pump."
    "Taco__007e": "Taco 007e basic circulator pump."
    "Armstrong__CompassH": "Armstrong CompassH 010V controllable pump."
    "Honeywell__T6-ZWave-Thermostat": "Honeywell TH6320ZW2003 T6 Pro Series Z-Wave Thermostat."
    "PRMFiltration__WM075": "A double-jet reed pulse producing Flow Meter with 3/4" pipe, one pulse per gallon. Cheaper than omegas."
    "BellGossett__Ecocirc20_18": "A 0-10V controllable pump that switches out of 0-10V control when sent a 0 V signal."
    "Tewa__TT0P-10KC3-T105-1500": "A 10K NTC thermistor used for wrapping around water pipes."
    "EKM__HOT-SPWM-075-HD": "3/4" horizontal hot water flow pulse meter, 1 pulse per 1/100 cubic ft (~0.0748 gallons)."
    "GridWorks__SimMultiTemp": "Simulated 12-channel Ads111x-based analog temp sensor"
    "GridWorks__SimTotalizer": "Simulated I2c-based pulse counter."
    "Krida__Double-Emr16-I2c-V3": "Two 16-Channel I2C Low Voltage Electromagnetic Relay Board, with first at address 0x20 and second at address 0x21"
    "GridWorks__SimDouble16PinI2cRelay": "Simulated I2c Relay board with two boards and 32 pins (for dev code using Krida__Doubler-Emr16-I2c-V3)."
    "GridWorks__TankModule2": "GridWorks__TankModule2 value"
    "GridWorks__PicoFlowHall": "GridWorks__PicoFlowHall value"
    "GridWorks__PicoFlowReed": "GridWorks__PicoFlowReed value"
    "Saier__Sen-HZG1WA": "Saier__Sen-HZG1WA value"
    "DFRobot__DFR0971_Times2": "Two DfRobot DFR0971 i2c 0-10V analog output actuators, set so the first has address 0x5e and the second has address 0x5f"
