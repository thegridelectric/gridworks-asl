$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.gridworks.energy/enums/spaceheat.telemetry.name.005"

title: "spaceheat.telemetry.name"
type: "string"
description: "Specifies the name of sensed data reported by a Spaceheat SCADA"

enum:
  - "Unknown"
  - "PowerW"
  - "RelayState"
  - "WaterTempCTimes1000"
  - "WaterTempFTimes1000"
  - "GpmTimes100"
  - "CurrentRmsMicroAmps"
  - "GallonsTimes100"
  - "VoltageRmsMilliVolts"
  - "MilliWattHours"
  - "MicroHz"
  - "AirTempCTimes1000"
  - "AirTempFTimes1000"
  - "ThermostatState"
  - "MicroVolts"
  - "VoltsTimesTen"
  - "WattHours"
  - "StorageLayer"
  - "PercentKeep"

default: "Unknown"

x-gridworks:
  owner: "gridworks-energy"
  version: "005"
  stable: true
  use_cases: ["SCADA telemetry data classification", "Sensor data type identification"]
  value_descriptions:
    "Unknown": "Default Value - unknown telemetry name"
    "PowerW": "Power in Watts"
    "RelayState": "Relay state: 1 (Energized), 0 (DeEnergized)"
    "WaterTempCTimes1000": "Water temperature in Celsius * 1000 (e.g., 43200 = 43.2°C)"
    "WaterTempFTimes1000": "Water temperature in Fahrenheit * 1000 (e.g., 142100 = 142.1°F)"
    "GpmTimes100": "Gallons Per Minute * 100 (e.g., 433 = 4.33 GPM)"
    "CurrentRmsMicroAmps": "Current measurement in RMS MicroAmps"
    "GallonsTimes100": "Gallons * 100 (e.g., 55300 = 55.3 gallons)"
    "VoltageRmsMilliVolts": "Voltage in RMS MilliVolts"
    "MilliWattHours": "Energy in MilliWattHours"
    "MicroHz": "Frequency in MicroHz (e.g., 59,965,332 = 59.965332 Hz)"
    "AirTempCTimes1000": "Air temperature in Celsius * 1000 (e.g., 6234 = 6.234°C)"
    "AirTempFTimes1000": "Air temperature in Fahrenheit * 1000 (e.g., 69329 = 69.329°F)"
    "ThermostatState": "Thermostat State: 0=idle, 1=heating, 2=pending heat"
    "MicroVolts": "Microvolts RMS"
    "VoltsTimesTen": "Voltage * 10"
    "WattHours": "Energy in WattHours"
    "StorageLayer": "Storage layer identifier"
    "PercentKeep": "Percentage to keep"