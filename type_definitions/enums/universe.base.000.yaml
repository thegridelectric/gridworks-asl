$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/enums/universe.type/000"

# For comprehensive GridWorks documentation, see: https://gridworks.readthedocs.io/
title: "universe.type"
type: "string"
description: >
  **Operational context classification for GridWorks deployments.**
  
  UniverseType provides shared vocabulary for describing the operational
  environment in which GridWorks actors, simulations, and market interactions
  occur. It is descriptive, not prescriptive: UniverseType communicates intent
  and expected guarantees, but does not by itself enforce behavior, security,
  or policy.

enum:
  - "Dev"
  - "Hybrid"
  - "Production"

default: "Dev"

x-gridworks:
  owner: "gridworks-energy"
  version: "000"
  value_descriptions:

    "Dev": >
      A single-user or single-organization development universe.
      Typically runs on one machine or a small local environment, may operate
      without Internet connectivity, and allows non-unique time and replay.
      Intended for learning, experimentation, and rapid iteration.
      No security or financial guarantees are implied.

    "Hybrid": >
      A shared, non-production universe where multiple organizations or actors
      may interact. Supports mixtures of simulated and real devices, simulated
      financial transactions, and coordinated experiments. Time is unique
      within a given world instance, enabling meaningful cross-actor analysis,
      but enforcement and security guarantees are limited.

    "Production": >
      A production universe where real assets, real financial transactions,
      and real-world time are in effect. Actors are expected to represent
      validated physical entities, and operational discipline, security, and
      correctness are required. Production universes imply strong expectations
      but do not specify enforcement mechanisms at the ASL level.
