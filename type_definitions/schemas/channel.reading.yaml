$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/schemas/channel.reading"

title: "channel.reading"
description: |
  A single telemetry channel reading consisting of a named channel, 
  its numeric measurement value, and the unit of measurement.
  This type is designed to be used within snapshot messages where 
  the timestamp is provided at the snapshot level.
type: object
required:
  - Name
  - Value
  - Unit
  - TypeName
properties:
  Name:
    type: string
    format: spaceheat.name
    description: The channel name identifying the measurement point
  Value:
    type: integer
    description: The measured value (typically scaled by a factor like 100 for precision)
  Unit:
    type: string
    description: |
      The unit of measurement (e.g., "GpmTimes100", "CelsiusTimes100").
      Units often include scaling factors to avoid floating point transmission.
  TypeName:
    type: string
    const: "channel.reading"
    description: Type identifier for channel readings
additionalProperties: false
x-gridworks:
  owner: "gridworks-energy"
