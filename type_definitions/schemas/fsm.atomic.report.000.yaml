$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/fsm.atomic.report/000"

title: "fsm.atomic.report"
type: object
description: >
  Single atomic FSM report item representing either an event or a scalar action
  emitted by a state machine transition.

properties:
  MachineHandle:
    $ref: "https://schemas.electricity.works/formats/handle.name"

  StateEnum:
    type: string

  ReportType:
    type: string
    enum:
      - "Other"
      - "Event"
      - "Action"

  ActionType:
    type: string
    enum:
      - "RelayPinSet"
      - "Analog010VSignalSet"
      - "Analog420maSignalSet"

  Action:
    type: integer

  EventEnum:
    $ref: "https://schemas.electricity.works/formats/left.right.dot"

  Event:
    type: string

  FromState:
    type: string

  ToState:
    type: string

  UnixTimeMs:
    $ref: "https://schemas.electricity.works/formats/utc.milliseconds"

  TriggerId:
    $ref: "https://schemas.electricity.works/formats/uuid4.str"

  TypeName:
    const: "fsm.atomic.report"

  Version:
    const: "000"

required:
  - MachineHandle
  - StateEnum
  - ReportType
  - UnixTimeMs
  - TriggerId
  - TypeName
  - Version

additionalProperties: true

x-gridworks:
  owner: "gridworks-energy"
  axioms:
    - number: 1
      name: "ActionPresenceConsistency"
      statement: >
        ActionType and Action SHALL be present if and only if ReportType equals
        Action.
    - number: 2
      name: "ActionValueSemantics"
      statement: >
        If Action is present, then its meaning SHALL be interpreted using the
        enum selected by ActionType.
    - number: 3
      name: "EventPresenceConsistency"
      statement: >
        EventEnum, Event, FromState, and ToState SHALL be present if and only
        if ReportType equals Event.
