$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/connectivity.edge.gt/000"

title: "connectivity.edge.gt"
description: >
  Directed adjacency relationship between two GNodes in the global grid
  topology. ConnectivityEdges form the minimal topological structure used for
  building the Copper Tree, running OPFs, and propagating constraints across
  MarketMakers and transactive assets.

type: object

properties:
  Id:
    $ref: "https://schemas.electricity.works/formats/uuid4.str"

  FromGNodeId:
    $ref: "https://schemas.electricity.works/formats/uuid4.str"
    description: "Source endpoint of the directed adjacency."

  ToGNodeId:
    $ref: "https://schemas.electricity.works/formats/uuid4.str"
    description: "Target endpoint of the directed adjacency."

  FromGNodeAlias:
    $ref: "https://schemas.electricity.works/formats/left.right.dot"

  ToGNodeAlias:
    $ref: "https://schemas.electricity.works/formats/left.right.dot"

  Status:
    $ref: "https://schemas.electricity.works/enums/g.node.status/000"

  TypeName:
    const: "connectivity.edge.gt"

  Version:
    const: "000"

required:
  - Id
  - FromGNodeId
  - ToGNodeId
  - TypeName
  - Version

additionalProperties: false

x-gridworks:
  owner: "gridworks-energy"
  version: "000"
  description_extended: >
    ConnectivityEdges define the directed edges of the GNode topology graph.
    For every hierarchical relationship implied by the GNode alias structure
    (the Copper Tree), the registry MUST include exactly one ConnectivityEdge.
    Additional ConnectivityEdges may be created to represent loops, bypasses,
    or conceptual connections used for OPF or constraint propagation.

    This version contains no electrical parameters and is purely topological.
    Physical devices and electrical characteristics (lines, transformers,
    impedances, limits) will be represented in separate types that reference
    ConnectivityEdges once the shared OPF ontology stabilizes.
