description: >
  Per-depth affine calibration parameters for tank temperature readings.

  Calibration is applied AFTER unit conversion, in the output unit of the
  derived temperature channel.

  For each depth:
    output_value = M * converted_input_value + B

  where:
    - converted_input_value is the raw sensor value converted into the
      derived channel’s OutputUnit (e.g. FahrenheitX100)
    - M is unitless
    - B is expressed in the same unit as the derived channel’s OutputUnit

  This schema does not assume any particular sensor encoding
  (e.g. Celsius or Fahrenheit); sensor-specific unit conversion is handled
  prior to calibration.

