$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/synced.readings.bundle/000"

title: "synced.readings.bundle"
type: object
description: >
  Time-aligned sequence of synchronized multi-channel readings with embedded
  channel semantics sufficient for independent interpretation.

  For each channel, values in its associated ValueList are ordered to align
  by index with TimestampList, such that the value at index i corresponds
  to TimestampList[i].

  ChannelDefinitions provides the measurement unit required to interpret
  values for each channel.

properties:

  AboutGNodeAlias:
    $ref: "https://schemas.electricity.works/formats/left.right.dot"

  Start:
    $ref: "https://schemas.electricity.works/formats/utc.iso8601.seconds"

  End:
    $ref: "https://schemas.electricity.works/formats/utc.iso8601.seconds"

  TimestampList:
    type: array
    items:
      $ref: "https://schemas.electricity.works/formats/utc.iso8601.seconds"

  ChannelReadingsList:
    type: array
    items:
      type: object
      properties:
        ChannelName:
          $ref: "https://schemas.electricity.works/formats/spaceheat.name"

        ValueList:
          type: array
          items:
            type: number

      required:
        - ChannelName
        - ValueList
    
  ChannelDefinitions:
    type: array
    description: >
      Minimal semantic definitions for each channel sufficient to interpret
      values without reference to external layout.
    items:
      type: object
      properties:
        Name:
          $ref: "https://schemas.electricity.works/formats/spaceheat.name"

        Unit:
          type: string

        UnitType:
          $ref: "https://schemas.electricity.works/formats/left.right.dot"
          description: >
            Name of the Sema vocabulary from which Unit is drawn.

      required:
        - Name
        - Unit
        - UnitType
      additionalProperties: false

  TypeName:
    const: "synced.readings.bundle"

  Version:
    const: "000"

required:
  - AboutGNodeAlias
  - Start
  - End
  - TimestampList
  - ChannelReadingsList
  - ChannelDefinitions
  - TypeName
  - Version

additionalProperties: false


examples:
  - |
  {
    "AboutGNodeAlias": "hw1.isone.me.versant.keene.beech.ta",
    "Start": "2025-02-26T00:00:00Z",
    "End": "2025-02-26T00:02:00Z",
    "TimestampList": [
      "2025-02-26T00:00:00Z",
      "2025-02-26T00:01:00Z",
      "2025-02-26T00:02:00Z"
    ],
    "ChannelReadingsList": [
      {
        "ChannelName": "buffer-depth1",
        "ValueList": [4973, 4966, 4979]
      },
      {
        "ChannelName": "hp-ewt",
        "ValueList": [18234, 18179, 18157]
      },
      {
        "ChannelName": "hp-idu-pwr",
        "ValueList": [14, 14, 14]
      },
      {
        "ChannelName": "persistence-delay",
        "ValueList": [0.231, 0.102, 3650.238]
      }
    ],
    "ChannelDefinitions": [
      {
        "Name": "buffer-depth1",
        "Unit": "FahrenheitX100",
        "UnitType": "gw1.unit"
      },
      {
        "Name": "hp-ewt",
        "Unit": "WaterTempCTimes1000",
        "UnitType": "spaceheat.telemetry.name"
      },
      {
        "Name": "hp-idu-pwr",
        "Unit": "Watts",
        "UnitType": "gw1.unit"
      },
      {
        "Name": "persistence-delay",
        "Unit": "Seconds",
        "UnitType": "gw1.float.unit"
      }
    ],
    "TypeName": "synced.readings.bundle",
    "Version": "000"
  }

x-gridworks:
  owner: "gridworks-energy"

  axioms:

    - number: 1
      name: "TerminalAssetAliasConstraint"
      statement: >
        AboutGNodeAlias SHALL identify a TerminalAsset and therefore
        SHALL end with the suffix ".ta".

    - number: 2
      name: "ChannelDefinitionBijection"
      statement: >
        ChannelName values SHALL be unique across ChannelReadingsList, and
        Name values SHALL be unique across ChannelDefinitions. Furthermore,
        the set of ChannelName values appearing in ChannelReadingsList SHALL
        equal the set of Name values appearing in ChannelDefinitions.


    - number: 3
      name: "TimestampAlignment"
      statement: >
        For each entry in ChannelReadingsList, the length of ValueList SHALL
        be equal to len(TimestampList).

    - number: 4
      name: "UnitTypeAndValueRepresentationConsistency"
      statement: >
        For each entry in ChannelDefinitions:

          - UnitType SHALL equal one of:
              gw1.unit
              gw1.float.unit
              spaceheat.telemetry.name

          - Unit SHALL be a valid value from the specified UnitType version:

            gw1.unit → version 001
            gw1.float.unit → version 000
            spaceheat.telemetry.name → version 007

          - If UnitType equals gw1.float.unit, values in ValueList SHALL be
            interpreted as floating point numbers.

          - If UnitType equals gw1.unit or spaceheat.telemetry.name, values in
            ValueList are intended to be represented as integers, with any
            required scaling encoded in the Unit.

  extended_description: >

    synced.readings.bundle represents a rectangular, time-aligned dataset
    across multiple channels.

    ChannelName values are identifiers defined within a GridWorks SCADA layout
    context (e.g. layout.lite or gw.nolan.layout). They are not globally
    standardized vocabulary and SHALL be interpreted only within the context
    in which they were produced.

    ChannelDefinitions provides a minimal projection of channel semantics,
    including Unit and UnitType, sufficient to interpret the numeric values
    in this bundle without requiring access to the full layout.

    In GridWorks systems, full channel definitions are typically available in
    layout artifacts such as layout.lite, which include additional information
    such as AboutNodeName, CapturedByNodeName, and derivation strategy. Those
    details are intentionally omitted here to keep this type lightweight and
    focused on boundary interpretation.

    All channels share a common TimestampList. For any index i, values across
    all channels correspond to the same point in time.