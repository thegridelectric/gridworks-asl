# seed_request_template.yaml

# Root type and enum targets for closure expansion.
# Empty options select only the latest version.
# include_all_versions selects every registry-declared version.
# versions selects explicit versions; intermediate type versions are added by expansion.

initial_targets:
  types:
    analytics.channel.gt:
      versions: ["000"]
    layout.lite:
      versions: ["011", "013"]
    report.event:
      versions: ["003"]
    snapshot.spaceheat:
      include_all_versions: true
    synced.readings.bundle: {}
