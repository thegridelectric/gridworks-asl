$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/enums/gw1.device.type/000"
title: "gw1.device.type"
type: "string"
description: 'The kind of device a component is built on — a device *category* identified by a PascalCase
  name (the `pascal.case` format). This replaces the legacy make/model-as-CAC concept: a device type is
  the granularity GridWorks cares to distinguish, NOT a strict manufacturer make+model (several eGauge
  models, say, map to one EgaugePowerMeter). Components carry their `DeviceType` as an open `pascal.case`
  string (so component types stay version-stable); the hardware layout enforces that the value is a member
  of this enum. Device types that carry category-level data beyond the name open a specialized `<family>.device.type.gt`
  (e.g. `gw1.scada.device.type.gt` for GridworksScadaGw108). Migrated from `spaceheat.make.model` (now
  frozen) — each value notes its old MakeModel.'
enum:
- UnknownDeviceType
- EgaugePowerMeter
- NcdRelayBoard
- AdafruitWaterproofTempSensor
- GridworksTsnap1ScadaBoard
- GridworksHighPrecisionWaterTemp
- GridworksSimPowerMeter
- SchneiderPowerMeter
- GridworksSim30AmpRelay
- OpenenergyEmonPi
- GridworksSimTsnap1
- AtlasEzfloFlowMeter
- HubitatC7Hub
- GridworksTankModule1
- FibaroAnalogTempSensor
- Amphenol10kThermistor
- YhdcCurrentTransformer
- MagnelabCurrentTransformer
- GridworksMultiTemp1
- KridaRelayBoard16
- OmegaFtb8007FlowMeter
- IstecFlowMeter
- OmegaFtb8010FlowMeter
- BelimoBallValve
- BelimoDiverterValve
- Taco0034Pump
- Taco007Pump
- ArmstrongCompassHPump
- HoneywellT6Thermostat
- PrmFlowMeter
- BellGossettEcocircPump
- TewaThermistor
- EkmFlowMeter
- GridworksSimMultiTemp
- GridworksSimTotalizer
- KridaDoubleRelayBoard16
- GridworksSimDouble16PinRelay
- GridworksTankModule2
- GridworksPicoFlowHall
- GridworksPicoFlowReed
- SaierFlowSensor
- DfrobotDualAnalogOut
- GridworksTankModule3
- GridworksGw101
- GridworksScadaGw108
- GridworksSimSensor
- GridworksSimRelayBank
default: UnknownDeviceType
x-gridworks:
  owner: gridworks-energy
  version: '000'
  value_descriptions:
