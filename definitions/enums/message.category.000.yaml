$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/enums/message.category/000"

title: "message.category"
type: "string"
description: "Categorizes message delivery patterns for Sema types. See [Message Delivery Architecture](https://gridworks.readthedocs.io/message-delivery-architecture/) for details."

enum:
  - "Unknown"
  - "JsonDirect"
  - "JsonBroadcast"
  - "ScadaWrapped"
  - "Serial"

default: "Unknown"

x-gridworks:
  owner: "gridworks-energy"
  version: "000"
  value_descriptions:
    "Unknown": "Default value when message pattern cannot be determined"
    "JsonDirect": |
      Point-to-point delivery between specific actors 
      Use for: commands, responses, targeted telemetry
    "JsonBroadcast": |
      One-to-many delivery to multiple recipients 
      Use for: market updates, price and weather forecasts, shared data
    "ScadaWrapped": "Messages sent from SCADA systems that may require acknowledgement tracking"
    "Serial": |
      Bandwidth-optimized binary format (future) 
      Use for: resource-constrained scenarios, high-frequency data
