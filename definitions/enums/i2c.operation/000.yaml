$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/enums/i2c.operation/000"

title: "i2c.operation"
type: "string"
description: >
  The kind of I²C bus operation an i2c.result reports.

enum:
  - "ReadBit"
  - "WriteBit"
  - "ReadReg"
  - "WriteReg"

default: "ReadBit"

x-gridworks:
  owner: "gridworks-energy"
  version: "000"
  value_descriptions:
    "ReadBit": >
      Read a single bit from a device register.
    "WriteBit": >
      Write a single bit to a device register.
    "ReadReg": >
      Read a 1- or 2-byte register.
    "WriteReg": >
      Write a 1- or 2-byte register.
