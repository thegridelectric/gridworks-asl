$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/snapshot.spaceheat/001"

title: "snapshot.spaceheat"
type: object
description: >
  Point-in-time snapshot containing the latest known readings captured by a
  Spaceheat SCADA. Version 001 carries readings only; machine states arrive in
  version 002.

properties:
  FromGNodeAlias:
    $ref: "https://schemas.electricity.works/formats/left.right.dot"

  FromGNodeInstanceId:
    $ref: "https://schemas.electricity.works/formats/uuid4.str"

  SnapshotTimeUnixMs:
    $ref: "https://schemas.electricity.works/formats/utc.milliseconds"

  LatestReadingList:
    type: array
    items:
      $ref: "https://schemas.electricity.works/types/single.reading/000"

  TypeName:
    const: "snapshot.spaceheat"

  Version:
    const: "001"

required:
  - FromGNodeAlias
  - FromGNodeInstanceId
  - SnapshotTimeUnixMs
  - LatestReadingList
  - TypeName
  - Version

additionalProperties: false

examples:
  - |
    {
      "FromGNodeAlias": "hw1.isone.me.versant.keene.beech.scada",
      "FromGNodeInstanceId": "19ee09df-80ba-437b-b6c1-1eebe9d34801",
      "SnapshotTimeUnixMs": 1730073634605,
      "LatestReadingList": [
        {
          "ChannelName": "hp-odu-pwr",
          "Value": 208,
          "ScadaReadTimeUnixMs": 1730073619651,
          "TypeName": "single.reading",
          "Version": "000"
        },
        {
          "ChannelName": "hp-idu-pwr",
          "Value": 12,
          "ScadaReadTimeUnixMs": 1730073605647,
          "TypeName": "single.reading",
          "Version": "000"
        },
        {
          "ChannelName": "dist-pump-pwr",
          "Value": 37,
          "ScadaReadTimeUnixMs": 1730073570639,
          "TypeName": "single.reading",
          "Version": "000"
        }
      ],
      "TypeName": "snapshot.spaceheat",
      "Version": "001"
    }

x-gridworks:
  owner: "gridworks-energy"
