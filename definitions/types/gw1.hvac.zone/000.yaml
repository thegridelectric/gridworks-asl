$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/gw1.hvac.zone/000"

title: "gw1.hvac.zone"
type: object
description: >
  One heating zone of a hydronic space-heating layout: its label, whether it is
  a critical (must-keep-warm) zone, and its thermal weight (kWh per degree F).
  A layout's zones are an ordered list of these; the 1-based position in that
  list is the zone index used to name the zone's temp/set/heat-call channels.
  Shared across hydronic layout families (House0, Nolan).

properties:
  Name:
    $ref: "https://schemas.electricity.works/formats/spaceheat.name"
    description: >
      The zone label (e.g. "down", "up"), used to form this zone's channel
      names "zone{i}-{Name}-temp", "-set", "-heat-call".

  Critical:
    type: boolean
    description: >
      True if this is a critical zone (one the controller must keep warm).

  KwhPerDegF:
    type: number
    description: >
      The zone's thermal weight: kilowatt-hours required to raise the zone one
      degree Fahrenheit. May be 0 for an untracked zone.

  TypeName:
    const: "gw1.hvac.zone"

  Version:
    const: "000"

required:
  - Name
  - Critical
  - KwhPerDegF
  - TypeName
  - Version

additionalProperties: false

x-gridworks:
  owner: "gridworks-energy"
