$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/gw1.hvac.zone/000"

title: "gw1.hvac.zone"
type: object
description: >
  One thermal zone: its label, whether it is a critical (must-keep-warm)
  zone, its thermal weight (kWh per degree F), and the channel carrying its
  air temperature.

properties:
  Name:
    $ref: "https://schemas.electricity.works/formats/spaceheat.name"
    description: >
      The zone label (e.g. "down", "up").

  Critical:
    type: boolean
    description: >
      True if this is a critical zone (one the controller must keep warm).

  KwhPerDegF:
    type: number
    description: >
      The zone's thermal weight: kilowatt-hours required to raise the zone one
      degree Fahrenheit. May be 0 for an untracked zone.

  TempChannelName:
    $ref: "https://schemas.electricity.works/formats/spaceheat.name"
    description: >
      Name of the channel carrying this zone's air temperature. Absent for a
      zone with no tracked temperature.

  TypeName:
    const: "gw1.hvac.zone"

  Version:
    const: "000"

required:
  - Name
  - Critical
  - KwhPerDegF
  - TypeName
  - Version

additionalProperties: false

x-gridworks:
  owner: "gridworks-energy"
  extended_description: >
    TempChannelName is source-agnostic. The referenced channel may be fed by
    a dedicated air-temperature sensor (e.g. a thermistor channel declared on
    an i2c.thermistor.reader.component.gt), by the temperature reading of a
    comms-capable thermostat (e.g. a gw1.zone.thermostat of kind
    HoneywellViaHubitat), or by a computed channel (e.g. a derived.channel.gt
    output).
