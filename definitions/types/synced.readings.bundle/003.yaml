$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/synced.readings.bundle/003"

title: "synced.readings.bundle"
type: object
description: >
  Time-aligned sequence of synchronized multi-channel readings with embedded
  channel semantics sufficient for independent interpretation.

  For each entry in ChannelReadingsList, values in its ValueList are ordered
  to align by index with TimestampList, such that the value at index i
  corresponds to TimestampList[i]. Each entry carries the measurement unit
  required to interpret its values.

  Entries in OperatingStateSequenceList are not part of that grid: each
  state sequence carries its own transition timestamps.

properties:

  AboutGNodeAlias:
    $ref: "https://schemas.electricity.works/formats/left.right.dot"

  StartTimestamp:
    $ref: "https://schemas.electricity.works/formats/utc.iso8601.seconds"

  EndTimestamp:
    $ref: "https://schemas.electricity.works/formats/utc.iso8601.seconds"

  TimestampList:
    type: array
    items:
      $ref: "https://schemas.electricity.works/formats/utc.iso8601.seconds"

  ChannelReadingsList:
    type: array
    items:
      $ref: "https://schemas.electricity.works/types/channel.readings.list.item/000"

  LatePersistenceTimePeriodList:
    type: array
    items:
      type: array
      items:
        $ref: "https://schemas.electricity.works/formats/utc.iso8601.seconds"
    description: >
      [PeriodStart, PeriodEnd] windows within the bundle's span whose
      readings were persisted late — recorded well after the times they
      describe (e.g. backfilled after an upload delay or comms outage).
      Consumers MAY treat readings in these windows as provisional or
      potentially incomplete.

  OperatingStateSequenceList:
    type: array
    items:
      $ref: "https://schemas.electricity.works/types/operating.state.sequence/000"
    description: >
      State-channel sequences (projections of machine states) covering the
      bundle's span. Unlike the bundle's seconds-resolution TimestampList,
      each sequence's own TimestampList is utc.iso8601.millis: relay state
      transitions can and do happen within a second.

  TypeName:
    const: "synced.readings.bundle"

  Version:
    const: "003"

required:
  - AboutGNodeAlias
  - StartTimestamp
  - EndTimestamp
  - TimestampList
  - ChannelReadingsList
  - LatePersistenceTimePeriodList
  - OperatingStateSequenceList
  - TypeName
  - Version

additionalProperties: false


examples:
  - |
    {
      "AboutGNodeAlias": "dw1.isone.me.versant.keene.apple.ta",
      "StartTimestamp": "2025-02-26T00:00:00Z",
      "EndTimestamp": "2025-02-26T00:02:00Z",
      "TimestampList": [
        "2025-02-26T00:00:00Z",
        "2025-02-26T00:01:00Z",
        "2025-02-26T00:02:00Z"
      ],
      "ChannelReadingsList": [
        {
          "ChannelName": "buffer-depth1",
          "ValueList": [4973, 4966, 4979],
          "Unit": "FahrenheitX100",
          "UnitType": "gw1.unit",
          "TypeName": "channel.readings.list.item",
          "Version": "000"
        },
        {
          "ChannelName": "hp-ewt",
          "ValueList": [18234, 18179, 18157],
          "Unit": "WaterTempCTimes1000",
          "UnitType": "spaceheat.telemetry.name",
          "TypeName": "channel.readings.list.item",
          "Version": "000"
        },
        {
          "ChannelName": "hp-idu-pwr",
          "ValueList": [14, 14, 14],
          "Unit": "Watts",
          "UnitType": "gw1.unit",
          "TypeName": "channel.readings.list.item",
          "Version": "000"
        },
        {
          "ChannelName": "persistence-delay",
          "ValueList": [231, 102, 3650238],
          "Unit": "Milliseconds",
          "UnitType": "gw1.unit",
          "TypeName": "channel.readings.list.item",
          "Version": "000"
        }
      ],
      "OperatingStateSequenceList": [
        {
          "ChannelName": "local-control-all-tanks-state",
          "ValueList": ["HpOffStoreOff", "HpOffStoreDischarge"],
          "TimestampList": ["2025-02-26T00:00:42.099Z", "2025-02-26T00:01:42.105Z"],
          "TypeName": "operating.state.sequence",
          "Version": "000"
        }
      ],
      "LatePersistenceTimePeriodList": [
        ["2025-02-26T00:01:15Z", "2025-02-26T00:01:30Z"]
      ],
      "TypeName": "synced.readings.bundle",
      "Version": "003"
    }

x-gridworks:
  owner: "gridworks-energy"

  axioms:

    - number: 1
      name: "TerminalAssetAliasConstraint"
      statement: >
        AboutGNodeAlias SHALL identify a TerminalAsset and therefore
        SHALL end with the suffix ".ta".

    - number: 2
      name: "ChannelDefinitionBijection"
      statement: >
        ChannelName values SHALL be unique across ChannelReadingsList.

    - number: 3
      name: "StartTimestampBeforeEnd"
      statement: >
        StartTimestamp shall be less than EndTimestamp

    - number: 4
      name: "TimestampAndValueLengthAlignment"
      statement: >
        The length of TimestampList shall be equal to the length of ValueList for each entry in ChannelReadingsList.

    - number: 5
      name: "UnitTypeAndValueRepresentationConsistency"
      statement: >
        For each entry in ChannelReadingsList:

          - UnitType SHALL equal one of:
              gw1.unit
              spaceheat.telemetry.name

          - Unit SHALL be a valid value from the specified UnitType version:

            gw1.unit → version 001
            spaceheat.telemetry.name → version 007

    - number: 6
      name: "LatePersistencePeriodWellFormedness"
      statement: >
        a. Each entry of LatePersistenceTimePeriodList SHALL contain exactly
           two elements: [PeriodStart, PeriodEnd].
        b. PeriodStart SHALL be less than PeriodEnd.
        c. Each period SHALL lie within the bundle's span:
           StartTimestamp <= PeriodStart and PeriodEnd <= EndTimestamp.

  extended_description: >

    `synced.readings.bundle` combines a rectangular, time-aligned dataset
    across multiple numeric channels (ChannelReadingsList, aligned by index
    to TimestampList) with event-form state sequences
    (OperatingStateSequenceList), which carry their own transition
    timestamps and are not aligned to the grid.

    ChannelName values are identifiers defined within a GridWorks SCADA layout
    context (e.g. layout.lite or gw.nolan.layout). They are not globally
    standardized vocabulary and SHALL be interpreted only within the context
    in which they were produced.

    Each ChannelReadingsList entry provides a minimal projection of channel
    semantics (`ChannelName`, `Unit`, `UnitType`), sufficient to interpret
    the numeric values in this bundle without requiring access to the full
    layout. This bundle is not a source of semantic authority; it provides
    a convenient projection for transport, indexing, and querying.
