$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/draft/types/gw1.scada.device.type.gt/000"

title: "gw1.scada.device.type.gt"
type: object
description: >
  DRAFT minimal stub. The specialized device-type record for a GridWorks SCADA board
  (the gw108 family) — the per-family successor to make/model-as-CAC for the board
  itself. Keyed by `DeviceType` (a `gw1.device.type` value, e.g. `GridworksScadaGw108`),
  it carries the board-level identity now. The full board descriptor — NativeGpio
  (Inputs/Outputs BCM pin maps), I2cRelays, CtAdc, ThermistorAdcs, Dacs (mirroring the
  scada `ScadaDeviceTypeGt` and Joe's `starter-scripts/gw108_test_code.py`) — lands when
  the gw108 board is codified. Flat.

properties:

  DeviceType:
    $ref: "https://schemas.electricity.works/formats/pascal.case"
    description: >
      The device category this record describes, an open `pascal.case` string (a
      `gw1.device.type` value, normally `GridworksScadaGw108`). The hardware layout
      enforces membership in `gw1.device.type`.

  DisplayName:
    type: string

  MinPollPeriodMs:
    $ref: "https://schemas.electricity.works/formats/positive.int"
    description: >
      Shortest polling period, in milliseconds, that this board supports.

  TypeName:
    const: "gw1.scada.device.type.gt"

  Version:
    const: "000"

required:
  - DeviceType
  - TypeName
  - Version

additionalProperties: false

x-gridworks:
  owner: "gridworks-energy"
