$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/gw1.scada.device.type.gt/000"

title: "gw1.scada.device.type.gt"
type: object
description: >
  The device-type record for a GridWorks SCADA board designed by GridWorks.

properties:

  DeviceType:
    $ref: "https://schemas.electricity.works/formats/pascal.case"
    description: >
      The device category this record describes.

  DisplayName:
    type: string

  MinPollPeriodMs:
    $ref: "https://schemas.electricity.works/formats/positive.int"
    description: >
      Shortest polling period, in milliseconds, that this board supports.

  BusList:
    type: array
    items:
      $ref: "https://schemas.electricity.works/types/i2c.bus/000"
    description: >
      The physical I²C buses this board exposes.

  TelemetryNameList:
    type: array
    items:
      $ref: "https://schemas.electricity.works/enums/spaceheat.telemetry.name/007"
    description: >
      The telemetry names this board can produce.

  NativeGpioInputs:
    type: array
    items:
      $ref: "https://schemas.electricity.works/types/gw.native.gpio.pin/000"
    description: >
      The board's native (on-board) GPIO input pins.

  NativeGpioOutputs:
    type: array
    items:
      $ref: "https://schemas.electricity.works/types/gw.native.gpio.pin/000"
    description: >
      The board's native (on-board) GPIO output pins.

  I2cRelays:
    type: array
    items:
      $ref: "https://schemas.electricity.works/types/i2c.relay.config/000"
    description: >
      The relays driven through the board's I²C GPIO expanders.

  CtAdc:
    $ref: "https://schemas.electricity.works/types/i2c.adc.config/000"
    description: >
      The current-transformer ADC, when present.

  ThermistorAdcs:
    type: array
    items:
      $ref: "https://schemas.electricity.works/types/i2c.thermistor.interface.config/000"
    description: >
      The thermistor-reading ADC interfaces on the board.

  Dacs:
    type: array
    items:
      $ref: "https://schemas.electricity.works/types/i2c.dac.config/000"
    description: >
      The digital-to-analog converters on the board.

  TypeName:
    const: "gw1.scada.device.type.gt"

  Version:
    const: "000"

required:
  - DeviceType
  - TypeName
  - Version

additionalProperties: false

