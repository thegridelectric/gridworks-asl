x-gridworks:
  owner: "gridworks-energy"
  axioms:
    - number: 1
      name: "BusMembership"
      statement: >
        Every I2cBus referenced by an entry in I2cRelays, CtAdc, ThermistorAdcs,
        or Dacs SHALL appear as a Name in BusList.
  extended_description: >
    Various hardware layouts enforce membership in `gw1.device.type` for the
    DeviceType (e.g. `GridworksScadaGw108`).

