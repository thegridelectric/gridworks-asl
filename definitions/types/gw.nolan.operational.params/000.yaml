$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/gw.nolan.operational.params/000"

title: "gw.nolan.operational.params"
type: object
description: >
  Operational parameters for one Nolan-family (gw108) home — the tunable
  state that changes without rewiring hardware. Pairs with a gw.nolan.layout
  artifact; the consumer resolves and decodes the ops artifact through the
  layout's family, so a mismatched pair fails at decode.

  Carries the per-channel capture/report tuning, the actuation authority and
  service mode (authority dominates: ServiceMode is inert unless
  ActuationAuthority is Active), the heat pump's COP and heating curves, and
  the cooling-season time-of-use schedule: the on-peak windows during which
  the heat pump is held off, and the zone-call circuits held to SCADA while
  the schedule runs.

properties:
  ScadaAlias:
    $ref: "https://schemas.electricity.works/formats/left.right.dot"
    description: >
      The alias of the Scada GNode that applies these params, making a stored
      or emitted instance self-identifying. The layout is the registry of
      record for the full GNode; the consumer checks this alias names the
      paired layout's Scada.

  CaptureTuningList:
    type: array
    items:
      $ref: "https://schemas.electricity.works/types/capture.tuning/000"
    description: >
      Per-channel capture/report tuning, one entry per captured channel.

  ActuationAuthority:
    $ref: "https://schemas.electricity.works/enums/gw1.actuation.authority/000"
    description: >
      The degree of physical actuation authority SCADA exercises. Authority
      dominates: ServiceMode is inert unless ActuationAuthority is Active.

  ServiceMode:
    $ref: "https://schemas.electricity.works/enums/gw1.service.mode/000"
    description: >
      The thermal service provided while ActuationAuthority is Active;
      inert otherwise.

  CopCurve:
    $ref: "https://schemas.electricity.works/types/cop.curve/000"
    description: >
      The heat pump's coefficient-of-performance model.

  HeatingCurve:
    $ref: "https://schemas.electricity.works/types/heating.curve/000"
    description: >
      The house's thermal / required-source-water-temperature model.

  OnPeakWindows:
    type: array
    items:
      $ref: "https://schemas.electricity.works/types/gw.tou.window/000"
    description: >
      The recurring on-peak windows during which the heat pump is held off.
      Each window names the days it binds; a day no window names runs
      unconstrained.

  SeasonalStorageMode:
    $ref: "https://schemas.electricity.works/enums/gw1.seasonal.storage.mode/000"
    description: >
      Which thermal stores participate in the current season's operation.

  HpTurnOnMinutes:
    $ref: "https://schemas.electricity.works/formats/positive.int"
    description: >
      Minutes the heat pump takes to reach steady output after turn-on.

  HpMaxKwEl:
    $ref: "https://schemas.electricity.works/formats/positive.float"
    description: >
      The heat pump's maximum electrical draw, in kW.

  ShortCycleBuffer:
    type: boolean
    description: >
      Whether to protect the heat pump from short cycling by buffering
      turn-off decisions.

  LoadOverestimationPercent:
    $ref: "https://schemas.electricity.works/formats/non.negative.int"
    description: >
      Percentage by which forecast heat load is deliberately overestimated.

  OilBoilerBackup:
    type: boolean
    description: >
      Whether the home has an oil boiler available as backup heat.

  HorizonHours:
    $ref: "https://schemas.electricity.works/formats/positive.int"
    description: >
      The FLO optimization horizon, in hours.

  TypeName:
    const: "gw.nolan.operational.params"

  Version:
    const: "000"

required:
  - ScadaAlias
  - CaptureTuningList
  - ActuationAuthority
  - ServiceMode
  - SeasonalStorageMode
  - CopCurve
  - HeatingCurve
  - HpTurnOnMinutes
  - HpMaxKwEl
  - ShortCycleBuffer
  - LoadOverestimationPercent
  - OilBoilerBackup
  - HorizonHours
  - OnPeakWindows
  - TypeName
  - Version

additionalProperties: false

examples:
  - |
    {
      "ScadaAlias": "d1.bench.honeysuckle.scada",
      "CaptureTuningList": [
        {
          "ChannelName": "hp-odu-pwr",
          "CapturePeriodS": 300,
          "AsyncCapture": true,
          "AsyncCaptureDelta": 200,
          "TypeName": "capture.tuning",
          "Version": "000"
        }
      ],
      "ActuationAuthority": "Active",
      "ServiceMode": "Cooling",
      "SeasonalStorageMode": "AllTanks",
      "CopCurve": {
        "Intercept": 1.02,
        "OatCoeff": 0.0257,
        "LwtCoeff": 0,
        "Min": 1.4,
        "MinOatF": 15,
        "TypeName": "cop.curve",
        "Version": "000"
      },
      "HeatingCurve": {
        "AlphaTimes10": 55,
        "BetaTimes100": -10,
        "GammaEx6": 0,
        "IntermediatePowerKw": 1.5,
        "IntermediateRswtF": 100,
        "DdPowerKw": 5.5,
        "DdRswtF": 150,
        "DdDeltaTF": 20,
        "MaxEwtF": 170,
        "TypeName": "heating.curve",
        "Version": "000"
      },
      "OnPeakWindows": [
        {
          "Start": "07:00",
          "End": "12:00",
          "Days": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
          "TypeName": "gw.tou.window",
          "Version": "000"
        },
        {
          "Start": "16:00",
          "End": "20:00",
          "Days": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
          "TypeName": "gw.tou.window",
          "Version": "000"
        }
      ],
      "HpTurnOnMinutes": 12,
      "HpMaxKwEl": 9.66,
      "ShortCycleBuffer": false,
      "LoadOverestimationPercent": 0,
      "OilBoilerBackup": false,
      "HorizonHours": 48,
      "TypeName": "gw.nolan.operational.params",
      "Version": "000"
    }

x-gridworks:
  owner: "gridworks-energy"

  axioms:
    - number: 1
      name: "CaptureTuningChannelUniqueness"
      statement: >
        ChannelName SHALL be unique across CaptureTuningList.
    - number: 2
      name: "PerDayWindowNonOverlap"
      statement: >
        For each day of the week, the windows in OnPeakWindows whose Days
        include that day SHALL NOT overlap one another.

  extended_description: >
    operational-params is the authored home for the tunable state that does
    not belong in the static hardware layout or deployment config: what an
    operator adjusts while the hardware stays put. The assembly step merges
    this artifact with the static layout to build the runtime layout the
    device actors read.

    The store and optimization knobs (SeasonalStorageMode, HpTurnOnMinutes,
    ShortCycleBuffer, LoadOverestimationPercent, OilBoilerBackup,
    HorizonHours) are carried here so this word and gw.house0.operational.params
    have identical field sets. Nolan has no thermal store to season, so they
    are not Nolan concepts; they are here because surfaces that still run for
    every family read them — the LeafAlly strategy selection and layout.lite,
    which requires them. They come back out as that functional code is moved
    off them.
