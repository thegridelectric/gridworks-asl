$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/schemas/spaceheat.node.gt/200"

title: "spaceheat.node.gt"
type: object
description: |
  A Spaceheat node representing a named element in a GridWorks SCADA system.

properties:
  Name:
    $ref: "https://schemas.electricity.works/formats/spaceheat.name"
    description: "Unique name for this node within the system"
    
  ActorHierarchyName:
    $ref: "https://schemas.electricity.works/formats/handle.name"
    description: |
      Hierarchical name in the actor command tree.
      Used when this node has an associated software actor.
      
  Handle:
    $ref: "https://schemas.electricity.works/formats/handle.name"
    description: "Handle for actor-to-actor communication"
    
  ActorClass:
    type: string
    description: |
      Class name of the software actor associated with this node.
      Examples: 'PowerMeter', 'HoneywellThermostat', 'NoActor'
      
  DisplayName:
    type: string
    description: "Human-readable display name for this node"
    
  ComponentId:
    $ref: "https://schemas.electricity.works/formats/uuid4.str"
    description: |
      UUID of the physical component associated with this node.
      Links to component definitions in the hardware layout.
      
  NameplatePowerW:
    type: integer
    minimum: 0
    description: "Nameplate power rating in watts"
    
  InPowerMetering:
    type: boolean
    description: |
      Whether this node's power consumption should be metered.
      When true, NameplatePowerW must be specified (see Axiom 1).
      
  ShNodeId:
    $ref: "https://schemas.electricity.works/formats/uuid4.str"
    description: "Immutable unique identifier for this SpaceHeat node"
    
  TypeName:
    const: "spaceheat.node.gt"
    
  Version:
    const: "200"

required:
  - Name
  - ActorClass  
  - ShNodeId
  - TypeName
  - Version

additionalProperties: true

examples:
  - |
    {
      "Name": "lc",
      "ActorClass": "LocalControl",
      "DisplayName": "LocalControl",
      "Handle": "auto.lc",
      "ShNodeId": "cf5fbc9e-9cba-4e0e-ba60-479dc026be3c",
      "TypeName": "spaceheat.node.gt",
      "Version": "200"
    }
  - |
    {
      "Name": "hp-odu",
      "ActorClass": "NoActor",
      "DisplayName": "Hp Odu",
      "InPowerMetering": true,
      "NameplatePowerW": 6000,
      "ShNodeId": "457499a7-7fec-41fd-bac5-d7e7d9c47dda",
      "TypeName": "spaceheat.node.gt",
      "Version": "200"
    }

x-gridworks:
  owner: "gridworks-energy"

  axioms:
    - number: 1
      name: "InPowerMetering requirements"
      statement: |
        If InPowerMetering exists and is true, then NameplatePowerW must exist.

  extended_description: > 
    Spaceheat nodes are the fundamental building blocks of an agent-based
    SCADA deployment for a hydronic heating system.

    Each node identifies a named element in the operational control model.
    Some nodes correspond to active software actors responsible for sensing,
    control, telemetry generation, or coordination. Others correspond to
    passive physical or logical entities that are measured or controlled by
    those actors. Still others represent higher-level semantic or coordination
    roles within the SCADA, such as supervisory nodes, derived generators,
    fallback logic, or system modes.

    Collectively, Spaceheat nodes define the operational topology of the system:
    what exists as a controllable or observable entity, which nodes host actors,
    and how sensing, actuation, and control semantics are organized.

    The Spaceheat node abstraction intentionally unifies physical equipment,
    software actors, and logical constructs under a single naming system, enabling
    consistent binding across telemetry, control, and coordination layers.