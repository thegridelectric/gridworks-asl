$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/i2c.multichannel.dt.relay.component.gt/005"

title: "i2c.multichannel.dt.relay.component.gt"
type: object
description: >
  Configuration for a multi-channel I2C relay component used by Spaceheat SCADA.

  This includes relay-actor configuration fields specific to the I2C relay
  board together with the logical I2C bus name used to address it at runtime.

properties:
  ComponentId:
    $ref: "https://schemas.electricity.works/formats/uuid4.str"

  DeviceType:
    $ref: "https://schemas.electricity.works/formats/pascal.case"
    description: >
      The device category this component is built on, an open `pascal.case`
      string (a `gw1.device.type` value). The hardware layout enforces
      membership in `gw1.device.type`.

  ConfigList:
    type: array
    items:
      $ref: "https://schemas.electricity.works/types/relay.actor.config/004"

  DisplayName:
    type: string

  HwUid:
    type: string

  I2cBus:
    $ref: "https://schemas.electricity.works/formats/spaceheat.name"
    description: >
      Spaceheat node name of the I2C bus actor that hosts this relay board.

  I2cAddressList:
    type: array
    items:
      type: integer
    description: >
      Integer I2C addresses used by the relay board hardware.

  TypeName:
    const: "i2c.multichannel.dt.relay.component.gt"

  Version:
    const: "005"

required:
  - ComponentId
  - DeviceType
  - ConfigList
  - I2cBus
  - I2cAddressList
  - TypeName
  - Version

additionalProperties: true

examples:
  - |
    {
      "ComponentId": "af037880-2e9c-41a8-890b-ff9e63ac8d90",
      "DeviceType": "KridaDoubleRelayBoard16",
      "ConfigList": [
        {
          "ChannelName": "scada",
          "CapturePeriodS": 1,
          "AsyncCapture": false,
          "RelayIdx": 1,
          "ActorName": "scada",
          "WiringConfig": "NormallyClosed",
          "EventType": "beech.1",
          "DeEnergizingEvent": "a",
          "EnergizingEvent": "a",
          "StateType": "beech.1",
          "DeEnergizedState": "a",
          "EnergizedState": "a",
          "TypeName": "relay.actor.config",
          "Version": "004"
        }
      ],
      "I2cBus": "scada",
      "I2cAddressList": [
        0
      ],
      "TypeName": "i2c.multichannel.dt.relay.component.gt",
      "Version": "005"
    }

x-gridworks:
  owner: "gridworks-energy"

  axioms:
    - number: 1
      name: "ChannelNameUniqueness"
      statement: >
        Channel names SHALL be unique across the ConfigList.
    - number: 2
      name: "ActorAndRelayIndexUniqueness"
      statement: >
        ConfigList SHALL NOT contain duplicate ActorName values or duplicate
        RelayIdx values.
