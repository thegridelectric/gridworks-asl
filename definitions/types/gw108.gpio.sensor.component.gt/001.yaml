$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/gw108.gpio.sensor.component.gt/001"

title: "gw108.gpio.sensor.component.gt"
type: object
description: >
  A GW108-board GPIO sensor component (one installed device instance): a single
  digital sensor wired to a GPIO pin, read either by polling or edge detection.
  Flat — the shared component fields are spelled out here.

properties:

  ComponentId:
    $ref: "https://schemas.electricity.works/formats/uuid4.str"

  ComponentAttributeClassId:
    $ref: "https://schemas.electricity.works/formats/uuid4.str"

  ConfigList:
    type: array
    items:
      $ref: "https://schemas.electricity.works/types/channel.config/000"
    description: >
      Channel configuration(s) for this sensor (one per the device).

  GpioPin:
    $ref: "https://schemas.electricity.works/formats/positive.int"
    description: >
      The GPIO pin (BCM numbering) this sensor is wired to.

  SenseMode:
    $ref: "https://schemas.electricity.works/enums/gpio.sense.mode/000"
    description: >
      Whether the pin is read by polling or by hardware edge detection.

  SendToDerived:
    type: boolean
    description: >
      Whether this raw sensor reading is also provided to derived-channel logic.

  DisplayName:
    type: string

  HwUid:
    type: string

  TypeName:
    const: "gw108.gpio.sensor.component.gt"

  Version:
    const: "001"

required:
  - ComponentId
  - ComponentAttributeClassId
  - ConfigList
  - GpioPin
  - SenseMode
  - SendToDerived
  - TypeName
  - Version

additionalProperties: false

examples:
  - |
    {
      "ComponentAttributeClassId": "8ad2f6fe-e834-4334-80c8-4a0d4ef4b04f",
      "ComponentId": "9fa9c10a-30c7-414e-a9cb-65a47150b755",
      "GpioPin": 17,
      "SenseMode": "Polling",
      "SendToDerived": true,
      "ConfigList": [
        {
          "ChannelName": "zone1-bedrooms-opto-input",
          "PollPeriodMs": 1000,
          "CapturePeriodS": 300,
          "AsyncCapture": true,
          "AsyncCaptureDelta": 1,
          "Exponent": 0,
          "Unit": "Unitless",
          "TypeName": "channel.config",
          "Version": "000"
        }
      ],
      "DisplayName": "Zone 1 Bedrooms Optocouple Input (0 means 24V)",
      "TypeName": "gw108.gpio.sensor.component.gt",
      "Version": "001"
    }

x-gridworks:
  owner: "gridworks-energy"
