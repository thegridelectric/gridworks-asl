$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/gw108.gpio.sensor.component.gt/001"

title: "gw108.gpio.sensor.component.gt"
type: object
description: >
  A GW108-board GPIO sensor component (one installed device instance): a single
  digital sensor wired to a GPIO pin, read either by polling or edge detection.
  Flat — the shared component fields are spelled out here.

properties:

  ComponentId:
    $ref: "https://schemas.electricity.works/formats/uuid4.str"

  DeviceType:
    $ref: "https://schemas.electricity.works/formats/pascal.case"
    description: >
      The device category this component is built on, an open `pascal.case`
      string (a `gw1.device.type` value). The hardware layout enforces
      membership in `gw1.device.type`.

  GpioPin:
    $ref: "https://schemas.electricity.works/formats/positive.int"
    description: >
      The GPIO pin (BCM numbering) this sensor is wired to.

  SenseMode:
    $ref: "https://schemas.electricity.works/enums/gpio.sense.mode/000"
    description: >
      Whether the pin is read by polling or by hardware edge detection.

  SendToDerived:
    type: boolean
    description: >
      Whether this raw sensor reading is also provided to derived-channel logic.

  DisplayName:
    type: string

  HwUid:
    type: string

  TypeName:
    const: "gw108.gpio.sensor.component.gt"

  Version:
    const: "001"

required:
  - ComponentId
  - DeviceType
  - GpioPin
  - SenseMode
  - SendToDerived
  - TypeName
  - Version

additionalProperties: false

examples:
  - |
    {
      "ComponentId": "f49e721c-b510-418e-a6af-843de90b3032",
      "DeviceType": "Gw108RevB",
      "GpioPin": 1,
      "SenseMode": "Polling",
      "SendToDerived": false,
      "TypeName": "gw108.gpio.sensor.component.gt",
      "Version": "001"
    }
x-gridworks:
  owner: "gridworks-energy"
  extended_description: >
    The `.gt` suffix declares that this type is coupled bijectively with a table in
    a canonical seed database (here, the terminalasset registry): the table's rows are
    instances of this type. Sema is the authority over what a row means; the seed
    table is the authority over which instances are currently asserted.
