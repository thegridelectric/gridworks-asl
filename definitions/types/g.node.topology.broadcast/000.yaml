$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/g.node.topology.broadcast/000"

title: "g.node.topology.broadcast"
type: object
description: >
  Broadcast of a Grid Node Registry topology change. After a re-parent (or other
  mutation) commits, the registry publishes the affected subtree as the updated
  GNodes (carrying their new aliases) so consumers can converge. Best-effort:
  convergence is by authorization, not by delivery.

properties:

  UpdatedNodes:
    type: array
    items:
      $ref: "https://schemas.electricity.works/types/g.node.gt/004"
    description: >
      The affected subtree after the change — each GNode in its updated form
      (new Alias where it changed). The immutable GNodeId is unchanged.

  TypeName:
    const: "g.node.topology.broadcast"

  Version:
    const: "000"

required:
  - UpdatedNodes
  - TypeName
  - Version

additionalProperties: false

examples:
  - |
    {
      "UpdatedNodes": [
        {
          "GNodeId": "dcb05390-5bca-40ef-b63d-7908ccb33d9b",
          "Alias": "d1.isone.me.versant.keene.sub5.beech",
          "BaseClass": "LeafTransactiveNode",
          "GNodeClass": "LeafTransactiveNode",
          "Status": "Active",
          "PositionPointId": "198ca6af-5a4b-43a2-a8a9-7546deabc731",
          "PrevAlias": "d1.isone.me.versant.keene.beech",
          "TypeName": "g.node.gt",
          "Version": "004"
        }
      ],
      "TypeName": "g.node.topology.broadcast",
      "Version": "000"
    }

x-gridworks:
  owner: "gridworks-energy"
