$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/draft/types/fis.authority.manifest/000"

title: "fis.authority.manifest"
type: object
description: >
  A coherent snapshot of the authority plane as maintained by the
  Fleet Index Service (FIS) at a specific point in time.

  This manifest encodes design-level invariants of Grid Node identity
  and runtime instance authority. It is intended for audit,
  verification, and architectural clarity. It is not part of the
  runtime authorization enforcement path.

properties:

  SnapshotId:
    $ref: "https://schemas.electricity.works/formats/uuid4.str"
    description: >
      Globally unique identifier for this authority snapshot.

  SnapshotTakenAtUnixMs:
    $ref: "https://schemas.electricity.works/formats/utc.milliseconds"
    description: >
      Timestamp at which the manifest snapshot was generated.

  ParentRootAliasList:
    type: array
    description: >
      List of alias prefixes considered valid parent roots for this
      manifest. GNodeList SHALL be closed under parent alias
      relationship up to one of these roots.
    items:
      $ref: "https://schemas.electricity.works/formats/left.right.dot"
    minItems: 1

  GNodeList:
    type: array
    description: >
      List of Grid Nodes included in this manifest.
    items:
      $ref: "https://schemas.electricity.works/types/g.node.gt/004"
    minItems: 1

  GNodeInstanceList:
    type: array
    description: >
      List of runtime instance records associated with GNodes in this manifest.
    items:
      $ref: "https://schemas.electricity.works/types/g.node.instance.gt/000"
    minItems: 1

  TypeName:
    const: "fis.authority.manifest"

  Version:
    const: "000"

required:
  - SnapshotId
  - SnapshotTakenAtUnixMs
  - ParentRootAliasList
  - GNodeList
  - GNodeInstanceList
  - TypeName
  - Version

additionalProperties: false

x-gridworks:
  owner: "jessica-millar"

  axioms:

    - number: 1
      name: "InstanceReferenceIntegrity"
      statement: >
        For every element in GNodeInstanceList, there SHALL exist
        exactly one element in GNodeList whose GNodeId matches
        the instance's GNodeId.

    - number: 2
      name: "SingleActiveInstancePerGNode"
      statement: >
        For each element in GNodeList, exactly one element in
        GNodeInstanceList SHALL have matching GNodeId and
        Status equal to Active.

    - number: 3
      name: "ParentClosureUpToDeclaredRoots"
      statement: >
        For every element in GNodeList, all alias prefixes of
        GNodeAlias SHALL also appear in GNodeList unless the prefix
        equals one of the aliases listed in ParentRootAliasList.

  extended_description: >
    This manifest formalizes authority-plane design invariants
    without embedding database implementation details.

    The SingleActiveInstancePerGNode invariant expresses the
    single-writer authority model enforced operationally by FIS.
    ParentClosureUpToDeclaredRoots ensures that the GNode alias
    hierarchy is structurally coherent within the manifest scope.

    This type is intended for architectural verification,
    regression testing, and diagnostic inspection.
    It is not required for runtime authorization enforcement.
