$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/gw.nolan.layout/000"

title: "gw.nolan.layout"
type: object
description: >
  A complete, self-contained configuration and topology snapshot for a Nolan
  hydronic space heating system. The layout binds together identity (GNodes),
  operational topology (ShNodes), telemetry (DataChannels and DerivedChannels),
  hardware components, and actor configurations into a single semantically
  consistent structure.

  This type is intended to be a deployable artifact. All referenced entities
  required for SCADA operation and coordination SHALL be present within the
  layout, enabling validation and execution without external registry access.

properties:

  GNodes:
    type: array
    items:
      $ref: "https://schemas.electricity.works/types/g.node.gt/006"
    description: >
      List of Grid Node identity objects included in this layout snapshot.
      Each element is a fully specified Grid Node identity record; the set of
      GNodeClass values that must be present is constrained by
      TransactivePowerChannel (axiom 1).

  ShNodes:
    type: array
    items:
      $ref: "https://schemas.electricity.works/types/spaceheat.node.gt/302"
    description: >
      List of Spaceheat nodes representing operational roles in the system.
      Keys are SpaceheatName identifiers. Each node corresponds to a functional
      role within the hydronic system.

  DataChannels:
    type: array
    items:
      $ref: "https://schemas.electricity.works/types/data.channel.gt/003"
    description: >
      List of raw telemetry channels produced by the SCADA system.
      
  DerivedChannels:
    type: array
    items:
      $ref: "https://schemas.electricity.works/types/derived.channel.gt/002"
    description: >
      List of computed telemetry channels derived from other sources,
      including raw data channels.

  Components:
    type: array
    description: >
      List of hardware components present in the system.
    items:
      oneOf:
        - $ref: "https://schemas.electricity.works/types/device.component.gt/000"
        - $ref: "https://schemas.electricity.works/types/electric.meter.component.gt/001"
        - $ref: "https://schemas.electricity.works/types/gpio.sensor.component.gt/000"
        - $ref: "https://schemas.electricity.works/types/gpio.relay.component.gt/000"
        - $ref: "https://schemas.electricity.works/types/i2c.dac.output.component.gt/000"
        - $ref: "https://schemas.electricity.works/types/i2c.multichannel.dt.relay.component.gt/004"
        - $ref: "https://schemas.electricity.works/types/i2c.relay.component.gt/000"
        - $ref: "https://schemas.electricity.works/types/i2c.thermistor.reader.component.gt/000"
        - $ref: "https://schemas.electricity.works/types/scada.board.component.gt/000"
        - $ref: "https://schemas.electricity.works/types/pico.btu.meter.component.gt/000"
        - $ref: "https://schemas.electricity.works/types/pico.tank.module.component.gt/012"
        - $ref: "https://schemas.electricity.works/types/sim.pico.tank.module.component.gt/001"
        - $ref: "https://schemas.electricity.works/types/sim.relay.component.gt/000"
        - $ref: "https://schemas.electricity.works/types/sim.sensor.component.gt/000"
        - $ref: "https://schemas.electricity.works/types/web.server.component.gt/001"

  DeviceTypes:
    type: array
    description: >
      The specialized per-family device-type records for the
      device categories present in `Components` that carry category-level data. A component
      joins its record by the shared `DeviceType` value (see the device-type membership
      axiom). Replaces the former make/model-as-CAC list.
    items:
      oneOf:
        - $ref: "https://schemas.electricity.works/types/electric.meter.device.type.gt/000"
        - $ref: "https://schemas.electricity.works/types/ads111x.based.device.type.gt/000"
        - $ref: "https://schemas.electricity.works/types/gw1.scada.device.type.gt/000"
        - $ref: "https://schemas.electricity.works/types/hp.device.type.gt/000"
        - $ref: "https://schemas.electricity.works/types/hp.control.box.device.type.gt/000"

  Hydronic:
    $ref: "https://schemas.electricity.works/types/gw.hydronic/000"

  TypeName:
    const: "gw.nolan.layout"

  Version:
    const: "000"

required:
  - GNodes
  - DeviceTypes
  - Components
  - ShNodes
  - DataChannels
  - DerivedChannels
  - Hydronic
  - TypeName
  - Version

additionalProperties: false

x-gridworks:
  owner: "gridworks-energy"

  axioms:
    - number: 1
      name: "TransactivePowerChannel"
      statement: >
        DerivedChannels SHALL contain exactly one channel whose Strategy is "transactive-power" —
        the metered transactive boundary, computed by the power-meter actor (not the
        derived-generator). Each name in that channel's InputChannelNames SHALL resolve to an
        existing DataChannel with TelemetryName "PowerW", and the AboutNode of each such DataChannel
        SHALL carry a NameplatePowerW. (The metered set is declared once here, replacing the former
        per-node InPowerMetering flag; the NameplatePowerW obligation folds in spaceheat.node.gt's
        retired InPowerMetering-requires-nameplate axiom.)

    - number: 2
      name: "BoardResolution"
      statement: >
        For every board-resident component in Components (gpio.sensor.component.gt,
        gpio.relay.component.gt, i2c.thermistor.reader.component.gt): its
        BoardComponentId SHALL equal the ComponentId of a scada.board.component.gt in
        Components; that board component's DeviceType SHALL match the DeviceType of a
        gw1.scada.device.type.gt record in DeviceTypes; and the component's board name
        (GpioName against NativeGpioInputs for sensors, GpioName against
        NativeGpioOutputs for relays, AdcName against the ThermistorAdcs Names for
        thermistor readers) SHALL match a Name in that record.

    - number: 3
      name: "CoreShNodesExistenceAndActorClass"
      statement: >
        ShNodes SHALL contain a node with each of the following Name / ActorClass pairs, and no
        additional ShNode with any of these Names SHALL exist:
          "s"                 → ActorClass "PrimaryScada"
          "s2"                → ActorClass "SecondaryScada"
          "power-meter"       → ActorClass "PowerMeter"
          "ltn"               → ActorClass "NoActor"
          "admin"             → ActorClass "NoActor"
          "auto"              → ActorClass "NoActor"
          "la"                → ActorClass "LeafAlly"
          "lc"                → ActorClass "LocalControl"
          "derived-generator" → ActorClass "DerivedGenerator"
        The effective handle (Handle if present, otherwise Name) of "admin" SHALL be "admin" and
        of "auto" SHALL be "auto".

    - number: 4
      name: "CommandNodesExistenceAndActorClass"
      statement: >
        ShNodes SHALL contain a node with each of the following Name / ActorClass pairs, and no
        additional ShNode with any of these Names SHALL exist:
          "n"           → ActorClass "NoActor"
          "pico-cycler" → ActorClass "PicoCycler"
          "hp-boss"     → ActorClass "HpBoss"
        The effective handle of "n" SHALL be "auto.lc.n". (hp-boss is a command node in every
        layout: hp-scada-ops-relay reports to it in all states, dormant when no heat pump is
        commandable.)

    - number: 5
      name: "RequiredActuators"
      statement: >
        a. ShNodes SHALL include nodes named
          "iso-valve-relay",
          "secondary-pump-relay",
          "hp-scada-ops-relay",
          "charge-valve-relay",
          "store-pump-relay",
          "buffer-top-elt-relay",
          "buffer-bottom-elt-relay",
          "tank1-top-elt-relay",
          and "tank1-bottom-elt-relay",
        each with ActorClass "Relay".
        b. Hydronic.ZoneCallCircuits SHALL be non-empty, and each circuit's
        FailsafeRelayNode and OpsRelayNode SHALL name a ShNode in ShNodes with
        ActorClass "Relay".
        c. ShNodes SHALL include a node named "secondary-010v" with ActorClass
        "ZeroTenOutputer" and a ComponentId equal to the ComponentId of an
        i2c.dac.output.component.gt in Components.

    - number: 6
      name: "RequiredHeatpumpEquipment"
      statement: >
        ShNodes SHALL include nodes named "hp-odu" and "hp-ctrl-box" (a Nolan home is a
        monobloc), each with a ComponentId equal to the ComponentId of a Component in
        Components, and each with ActorClass "NoActor" unless it is the node
        Hydronic.HpCommandNodeName names, whose ActorClass CommandableHeatPump governs.

    - number: 7
      name: "ComponentBinding"
      statement: >
        Every Component in Components SHALL have its ComponentId referenced by exactly one
        ShNode in ShNodes. The node's Name is the component's identity within the house;
        the ComponentId is the replaceable instance under it (a swapped part keeps the
        name and gets a fresh id).

    - number: 8
      name: "RequiredSensing"
      statement: >
        For each of the names
          "hp-lwt",
          "hp-ewt",
          "dist-swt",
          "dist-rwt",
          "store-hot-pipe",
          "store-cold-pipe",
          "secondary-lwt",
          "secondary-ewt",
          "dist-flow",
          "primary-flow",
          "store-flow",
          "secondary-flow",
          "buffer-depth1-device",
          "buffer-depth2-device",
          "buffer-depth3-device",
          "tank1-depth1-device",
          "tank1-depth2-device",
          "tank1-depth3-device",
          "hp-odu-pwr",
          "hp-ctrl-box-pwr",
          "buffer-top-elt-pwr",
          "buffer-bottom-elt-pwr",
          "tank1-top-elt-pwr",
          and "tank1-bottom-elt-pwr":
        a channel with that Name SHALL exist in
        DataChannels or in DerivedChannels. (Kind-agnostic by design: a name
        may migrate from raw DataChannel to same-name DerivedChannel — as tank
        temperatures did — without touching this contract.)

    - number: 9
      name: "SingleStoreTank"
      statement: >
        Hydronic.TotalStoreTanks SHALL equal 1 — the Nolan plant carries exactly
        one store tank.

    - number: 10
      name: "CommandableHeatPump"
      statement: >
        a. If Hydronic.HpCommandNodeName is present, it SHALL equal the Name of a ShNode in
        ShNodes named "hp-odu", "hp-idu" or "hp-ctrl-box", whose ComponentId equals the
        ComponentId of a Component in Components, whose ActorClass is "HpTwin", and whose
        effective handle (Handle if present, otherwise Name) has the effective handle of the
        ShNode named "hp-boss" as its parent prefix.
        b. Every ShNode with ActorClass "HpTwin" SHALL be the node Hydronic.HpCommandNodeName
        names; when HpCommandNodeName is absent no ShNode SHALL have ActorClass "HpTwin".
    - number: 11
      name: "PrefixClosedHandles"
      statement: >
        Let the effective handle of an ShNode be its Handle if present,
        otherwise its Name. The set of effective handles SHALL be prefix-closed:
        for every ShNode in ShNodes, each dot-separated prefix of its effective
        handle SHALL also be the effective handle of some ShNode in ShNodes.
    - number: 12
      name: "ActuatorLeaves"
      statement: >
        Let the effective handle of an ShNode be its Handle if present, otherwise
        its Name. A leaf is an ShNode whose effective handle contains a dot and is
        the parent prefix of no other effective handle. An actuator is an ShNode
        whose ActorClass is "Relay", "ZeroTenOutputer" or "HpTwin". A command node
        is an ShNode whose ActorClass is "LocalControl", "LeafAlly", "PicoCycler",
        "HpBoss" or "SiegLoop", or whose ActorClass is "NoActor" and whose
        effective handle's parent prefix is the effective handle of an ShNode with
        ActorClass "LocalControl".
        a. Every actuator SHALL have a dotted effective handle and SHALL be a leaf.
        b. Every leaf SHALL be an actuator or a command node.
  extended_description: >
    TODO: add Nolan specific information (e.g. radiant floor heating, Gw108).
