$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/gw108.vdc.relay.component.gt/001"

title: "gw108.vdc.relay.component.gt"
type: object
description: >
  A GW108-board VDC relay component (one installed device instance): a single relay
  driven from a GPIO pin, configured by one relay.actor.config. Flat — the shared
  component fields are spelled out here.

properties:

  ComponentId:
    $ref: "https://schemas.electricity.works/formats/uuid4.str"

  DeviceType:
    $ref: "https://schemas.electricity.works/formats/pascal.case"
    description: >
      The device category this component is built on, an open `pascal.case`
      string (a `gw1.device.type` value). The hardware layout enforces
      membership in `gw1.device.type`.

  ConfigList:
    type: array
    items:
      $ref: "https://schemas.electricity.works/types/relay.actor.config/003"
    description: >
      Relay actor configuration(s) for this relay (one per the device).

  GpioPin:
    $ref: "https://schemas.electricity.works/formats/positive.int"
    description: >
      The GPIO pin (BCM numbering) driving this relay.

  DisplayName:
    type: string

  HwUid:
    type: string

  TypeName:
    const: "gw108.vdc.relay.component.gt"

  Version:
    const: "001"

required:
  - ComponentId
  - DeviceType
  - ConfigList
  - GpioPin
  - TypeName
  - Version

additionalProperties: false

examples:
  - |
    {
      "ComponentId": "4020eda2-c40b-48e3-81df-f7c76d40bc4c",
      "DeviceType": "GridworksScadaGw108",
      "ConfigList": [
        {
          "ChannelName": "scada",
          "RelayIdx": 1,
          "ActorName": "scada",
          "WiringConfig": "NormallyClosed",
          "EventType": "beech.1",
          "DeEnergizingEvent": "a",
          "EnergizingEvent": "a",
          "StateType": "beech.1",
          "DeEnergizedState": "a",
          "EnergizedState": "a",
          "TypeName": "relay.actor.config",
          "Version": "003"
        }
      ],
      "GpioPin": 1,
      "TypeName": "gw108.vdc.relay.component.gt",
      "Version": "001"
    }
x-gridworks:
  owner: "gridworks-energy"
  axioms:
    - number: 1
      name: "ChannelNameUniqueness"
      statement: >
        Channel names SHALL be unique across the ConfigList.
  extended_description: >
    The `.gt` suffix declares that this type is coupled bijectively with a table in
    a canonical seed database (here, the terminalasset registry): the table's rows are
    instances of this type. Sema is the authority over what a row means; the seed
    table is the authority over which instances are currently asserted.
