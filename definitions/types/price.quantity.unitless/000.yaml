$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/price.quantity.unitless/000"

title: "price.quantity.unitless"
type: object
description: >
  Integer price and quantity pair for market bidding and dispatch curves.

  Both values are serialized as strict integers scaled by 1000.

properties:

  PriceTimes1000:
    type: integer
    description: >
      Price value scaled by 1000.

  QuantityTimes1000:
    type: integer
    description: >
      Quantity value scaled by 1000.

  TypeName:
    const: "price.quantity.unitless"

  Version:
    const: "000"

required:
  - PriceTimes1000
  - QuantityTimes1000
  - TypeName
  - Version

additionalProperties: false

examples:
  - |
    {
      "PriceTimes1000": 12500,
      "QuantityTimes1000": -3000,
      "TypeName": "price.quantity.unitless",
      "Version": "000"
    }

x-gridworks:
  owner: "gridworks-energy"
