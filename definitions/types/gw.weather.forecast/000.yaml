$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/gw.weather.forecast/000"

title: "gw.weather.forecast"
type: object
description: >
  One forecast emission: per-channel slice values for one or more
  forecast channels. ForecastCreated is the forecaster's own data
  stamp (for NWS the gridpoint updateTime), not the emission wall
  clock, so an unchanged product re-emits identically and (forecast
  channel, ForecastCreated) is the revision key — there is no wire
  uid. Emission is always on the channel's schedule; Fidelity declares
  the degradation rung when the source is unavailable.

properties:
  ForecastCreated:
    $ref: "https://schemas.electricity.works/formats/utc.iso8601.seconds"
    description: >
      The forecaster's creation stamp for this product revision. Never
      the emission time.

  Fidelity:
    $ref: "https://schemas.electricity.works/enums/gw.weather.forecast.fidelity/000"
    description: >
      The degradation rung of this emission. Each downgrade transition
      additionally raises a Glitch.

  Forecasts:
    type: array
    items:
      $ref: "https://schemas.electricity.works/types/gw.weather.forecast.entry/000"
    description: >
      One entry per forecast channel in this emission.

  TypeName:
    const: "gw.weather.forecast"

  Version:
    const: "000"

required:
  - ForecastCreated
  - Fidelity
  - Forecasts
  - TypeName
  - Version

additionalProperties: false

examples:
  - |
    {
      "ForecastCreated": "2026-08-11T14:00:00Z",
      "Fidelity": "Live",
      "Forecasts": [
        {
          "ChannelName": "us.me.millinocket.temperature.forecast.nws",
          "FirstSliceStart": "2026-08-11T15:00:00Z",
          "Values": [5150, 5080],
          "TypeName": "gw.weather.forecast.entry",
          "Version": "000"
        }
      ],
      "TypeName": "gw.weather.forecast",
      "Version": "000"
    }

x-gridworks:
  owner: "gridworks-energy"

  axioms:
    - number: 1
      name: "NonEmptyForecasts"
      statement: >
        Forecasts SHALL be non-empty.
    - number: 2
      name: "ChannelUniqueness"
      statement: >
        No two elements of Forecasts SHALL share a ChannelName.
