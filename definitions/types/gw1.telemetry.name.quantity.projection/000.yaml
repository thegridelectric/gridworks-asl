$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/gw1.telemetry.name.quantity.projection/000"

title: "telemetry.name.quantity.projection"
type: object
description: >
  Canonical projection from spaceheat.telemetry.name to gw1.quantity.

  This type declares the deterministic semantic relationship by which
  every legacy Spaceheat telemetry encoding maps to exactly one
  gw1.quantity value.

  It exists to support safe transition from TelemetryName-based
  dimensional encoding toward explicit gw1.unit and gw1.quantity
  separation.

properties:

  TelemetryName:
    $ref: "https://schemas.electricity.works/enums/spaceheat.telemetry.name/006"
    description: >
      Legacy telemetry encoding value.

  Quantity:
    $ref: "https://schemas.electricity.works/enums/gw1.quantity/000"
    description: >
      Canonical physical or logical quantity associated with
      the specified TelemetryName.

  TypeName:
    const: "gw1.telemetry.name.quantity.projection"

  Version:
    const: "000"

required:
  - TelemetryName
  - Quantity
  - TypeName
  - Version

additionalProperties: false

examples:
  - |
    {
      "TelemetryName": "PowerW",
      "Quantity": "Power",
      "TypeName": "gw1.telemetry.name.quantity.projection",
      "Version": "000"
    }

x-gridworks:
  owner: "gridworks-energy"

  projection:
    from: TelemetryName
    to: Quantity
    table:
      Unknown: Unknown

      PowerW: Power
      WattHours: Energy
      MilliWattHours: Energy

      WaterTempCTimes1000: Temperature
      WaterTempFTimes1000: Temperature
      AirTempCTimes1000: Temperature
      AirTempFTimes1000: Temperature
      CelsiusTimes100: Temperature

      GpmTimes100: FlowRate
      GallonsTimes100: Volume

      VoltageRmsMilliVolts: Voltage
      VoltsTimesTen: Voltage
      VoltsTimes100: Voltage
      MicroVolts: Voltage

      CurrentRmsMicroAmps: Current

      HzTimes100: Frequency
      MicroHz: Frequency

      RelayState: Unitless
      ThermostatState: Unitless
      StorageLayer: Unitless

      PercentKeep: Percent

  axioms:
    - number: 1
      name: "EnumeratedTelemetryProjectionMapping"
      statement: >
        Every (TelemetryName, Quantity) pair SHALL match the mapping declared
        in x-gridworks.projection.table. Any other combination is invalid.
