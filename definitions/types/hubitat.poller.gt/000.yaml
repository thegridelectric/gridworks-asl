$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/hubitat.poller.gt/000"

title: "hubitat.poller.gt"
type: object
description: >
  Poller settings for one Hubitat device: which Hubitat component and device to poll, the
  attributes mapped onto SCADA channels, and the poll cadence.

properties:

  HubitatComponentId:
    $ref: "https://schemas.electricity.works/formats/uuid4.str"
    description: >
      The ComponentId of the hubitat.component.gt this poller reads through.

  DeviceId:
    $ref: "https://schemas.electricity.works/formats/positive.int"
    description: >
      The Hubitat device id this poller targets.

  Attributes:
    type: array
    items:
      $ref: "https://schemas.electricity.works/types/maker.api.attribute.gt/000"
    description: >
      The device attributes mapped onto SCADA channels.

  Enabled:
    type: boolean
    description: >
      Whether this poller is active.

  WebListenEnabled:
    type: boolean
    description: >
      Whether this poller is updated via the MakerAPI web-listen (push) path.

  PollPeriodSeconds:
    type: number
    description: >
      How often the device is polled, in seconds.

  TypeName:
    const: "hubitat.poller.gt"

  Version:
    const: "000"

required:
  - HubitatComponentId
  - DeviceId
  - Attributes
  - Enabled
  - WebListenEnabled
  - PollPeriodSeconds
  - TypeName
  - Version

additionalProperties: false

x-gridworks:
  owner: "gridworks-energy"
