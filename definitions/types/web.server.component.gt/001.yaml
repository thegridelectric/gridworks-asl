$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/web.server.component.gt/001"

title: "web.server.component.gt"
type: object
description: >
  A web-server component (one installed device instance) that exposes a local HTTP
  server (e.g. for Pico devices to POST to). Flat — the shared component fields are
  spelled out here; the server settings are an inline WebServer object.

properties:

  ComponentId:
    $ref: "https://schemas.electricity.works/formats/uuid4.str"

  ComponentAttributeClassId:
    $ref: "https://schemas.electricity.works/formats/uuid4.str"

  ConfigList:
    type: array
    items:
      $ref: "https://schemas.electricity.works/types/channel.config/000"
    description: >
      Channel configurations attached to this component (often empty for a web
      server).

  WebServer:
    type: object
    description: >
      The local HTTP server settings.
    properties:
      Enabled:
        type: boolean
      Host:
        type: string
      Name:
        type: string
      Port:
        type: integer
      Kwargs:
        type: object
        description: >
          Free-form keyword arguments passed through to the server.
    required:
      - Enabled
      - Host
      - Name
      - Port
      - Kwargs
    additionalProperties: false

  DisplayName:
    type: string

  HwUid:
    type: string

  TypeName:
    const: "web.server.component.gt"

  Version:
    const: "001"

required:
  - ComponentId
  - ComponentAttributeClassId
  - ConfigList
  - WebServer
  - TypeName
  - Version

additionalProperties: false

examples:
  - |
    {
      "ComponentAttributeClassId": "6e966031-d074-4a0f-8aa0-18baee37ff29",
      "ComponentId": "a3f92c10-de37-4df7-8b4d-ec0cfaed46c2",
      "ConfigList": [],
      "DisplayName": "Web Server default",
      "TypeName": "web.server.component.gt",
      "Version": "001",
      "WebServer": {
        "Enabled": true,
        "Host": "0.0.0.0",
        "Kwargs": {},
        "Name": "default",
        "Port": 8080
      }
    }

x-gridworks:
  owner: "gridworks-energy"
