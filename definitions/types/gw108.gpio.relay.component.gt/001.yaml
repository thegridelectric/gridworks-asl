$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/draft/types/gw108.gpio.relay.component.gt/001"

title: "gw108.gpio.relay.component.gt"
type: object
description: >
  DRAFT placeholder. A GW108-board GPIO relay component instance. There is no
  scada-runtime class for this TypeName yet — the real GW108 relay is
  `gw108.vdc.relay.component.gt`. Kept as a draft so the (draft) `gw.nolan.layout`
  Components union can reference it; finalize or drop once its runtime form is
  decided. Flat.

properties:

  ComponentId:
    $ref: "https://schemas.electricity.works/formats/uuid4.str"

  ComponentAttributeClassId:
    $ref: "https://schemas.electricity.works/formats/uuid4.str"

  ConfigList:
    type: array
    items:
      $ref: "https://schemas.electricity.works/types/relay.actor.config/002"

  GpioPin:
    $ref: "https://schemas.electricity.works/formats/positive.int"

  DisplayName:
    type: string

  HwUid:
    type: string

  TypeName:
    const: "gw108.gpio.relay.component.gt"

  Version:
    const: "001"

required:
  - ComponentId
  - ComponentAttributeClassId
  - ConfigList
  - GpioPin
  - TypeName
  - Version

additionalProperties: false

examples:
  - |
    {
      "ComponentId": "11111111-1111-4111-8111-111111111111",
      "ComponentAttributeClassId": "8ad2f6fe-e834-4334-80c8-4a0d4ef4b04f",
      "ConfigList": [
        {
          "ActorName": "gpio-relay-1",
          "AsyncCapture": true,
          "AsyncCaptureDelta": 1,
          "CapturePeriodS": 300,
          "ChannelName": "gpio-relay",
          "DeEnergizedState": "RelayClosed",
          "DeEnergizingEvent": "CloseRelay",
          "EnergizedState": "RelayOpen",
          "EnergizingEvent": "OpenRelay",
          "EventType": "change.relay.state",
          "Exponent": 0,
          "PollPeriodMs": 200,
          "RelayIdx": 1,
          "StateType": "relay.closed.or.open",
          "TypeName": "relay.actor.config",
          "Unit": "Unitless",
          "Version": "002",
          "WiringConfig": "NormallyClosed"
        }
      ],
      "GpioPin": 24,
      "DisplayName": "GW108 GPIO Relay (draft placeholder)",
      "TypeName": "gw108.gpio.relay.component.gt",
      "Version": "001"
    }

x-gridworks:
  owner: "gridworks-energy"
