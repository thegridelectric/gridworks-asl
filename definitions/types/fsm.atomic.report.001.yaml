$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/fsm.atomic.report/001"

title: "fsm.atomic.report"
type: object
description: >
  Single atomic FSM report item representing either an event or an action
  emitted by a state machine transition. An action represents a side-effect
  applied to the physical or logical system.

properties:

  MachineHandle:
    $ref: "https://schemas.electricity.works/formats/handle.name"
    description: >
      Identifier of the state machine instance emitting this report.

  StateEnum:
    type: string
    description: >
      Name of the state machine enum defining the current state space.

  ReportType:
    $ref: "https://schemas.electricity.works/enums/fsm.report.type/000"
    description: >
      Indicates whether this report represents an Event, an Action, or Other.

  Action:
    description: >
      Structured payload describing a side-effect produced by the state machine.
      The structure of this object determines the type of action being executed.
    oneOf:
      - type: object
        description: >
          Relay energization command. Sets a relay to either energized or
          de-energized state.
        properties:
          Value:
            $ref: "https://schemas.electricity.works/enums/relay.energization.state/000"
            description: >
              Target energization state of the relay.
        required:
          - Value
        additionalProperties: false

      - type: object
        description: >
          I2C bit write operation. Writes a single bit value to a specified
          register on an I2C device.
        properties:
          I2cBus:
            $ref: "https://schemas.electricity.works/formats/spaceheat.name"
            description: >
              Logical name of the I2C bus.
          Address:
            type: integer
            description: >
              I2C device address.
          I2cRegister:
            type: integer
            description: >
              Register address within the device.
          Bit:
            type: integer
            description: >
              Bit position within the register.
          Value:
            type: integer
            description: >
              Bit value to write (typically 0 or 1).
        required:
          - I2cBus
          - Address
          - I2cRegister
          - Bit
          - Value
        additionalProperties: false

  EventEnum:
    $ref: "https://schemas.electricity.works/formats/left.right.dot"
    description: >
      Identifier describing the type of event.

  Event:
    type: string
    description: >
      Event payload or label emitted by the state machine.

  FromState:
    type: string
    description: >
      State prior to the transition.

  ToState:
    type: string
    description: >
      State after the transition.

  UnixTimeMs:
    $ref: "https://schemas.electricity.works/formats/utc.milliseconds"
    description: >
      Timestamp of the report in milliseconds since Unix epoch.

  TriggerId:
    $ref: "https://schemas.electricity.works/formats/uuid4.str"
    description: >
      Unique identifier for the triggering event or transition.

  TypeName:
    const: "fsm.atomic.report"

  Version:
    const: "001"

required:
  - MachineHandle
  - StateEnum
  - ReportType
  - UnixTimeMs
  - TriggerId
  - TypeName
  - Version

additionalProperties: true

x-gridworks:
  owner: "gridworks-energy"

  axioms:
    - number: 1
      name: "ActionPresenceConsistency"
      statement: >
        Action SHALL be present if and only if ReportType equals Action.

    - number: 2
      name: "EventPresenceConsistency"
      statement: >
        EventEnum, Event, FromState, and ToState SHALL be present if and only
        if ReportType equals Event.
