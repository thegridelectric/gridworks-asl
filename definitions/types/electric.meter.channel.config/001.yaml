$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/electric.meter.channel.config/001"

title: "electric.meter.channel.config"
type: object
description: >
  Per-channel configuration for one telemetry channel read from an electric meter.
  Flat — it spells out the shared channel-config fields (it does not inherit a base
  config type) and adds the optional EGauge modbus register mapping for meters read
  over modbus.

properties:

  ChannelName:
    $ref: "https://schemas.electricity.works/formats/spaceheat.name"

  PollPeriodMs:
    $ref: "https://schemas.electricity.works/formats/positive.int"
    description: >
      How often SCADA polls the meter for a fresh value, in milliseconds.

  CapturePeriodS:
    $ref: "https://schemas.electricity.works/formats/positive.int"
    description: >
      How often SCADA reports this channel value into the telemetry stream, in
      seconds.

  AsyncCapture:
    type: boolean

  AsyncCaptureDelta:
    $ref: "https://schemas.electricity.works/formats/positive.int"
    description: >
      Threshold for asynchronous emission, expressed in the channel's serialized
      integer reading units.

  EgaugeRegisterConfig:
    $ref: "https://schemas.electricity.works/types/egauge.register.config/000"
    description: >
      EGauge modbus register mapping for this channel, when the meter is read over
      modbus. Absent for non-modbus meters.

  TypeName:
    const: "electric.meter.channel.config"

  Version:
    const: "001"

required:
  - ChannelName
  - CapturePeriodS
  - AsyncCapture
  - TypeName
  - Version

additionalProperties: false

examples:
  - |
    {
      "ChannelName": "scada",
      "CapturePeriodS": 1,
      "AsyncCapture": false,
      "TypeName": "electric.meter.channel.config",
      "Version": "001"
    }

x-gridworks:
  owner: "gridworks-energy"
