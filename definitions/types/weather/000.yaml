$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/weather/000"

title: "weather"
type: object
description: >
  Single-point weather observation sent by an ATN to a SCADA node.

properties:

  FromGNodeAlias:
    $ref: "https://schemas.electricity.works/formats/left.right.dot"

  WeatherChannelName:
    $ref: "https://schemas.electricity.works/formats/left.right.dot"

  UnixTimeS:
    $ref: "https://schemas.electricity.works/formats/utc.seconds"

  OutsideAirTempF:
    type: number

  WindSpeedMph:
    type: number

  TypeName:
    const: "weather"

  Version:
    const: "000"

required:
  - FromGNodeAlias
  - WeatherChannelName
  - UnixTimeS
  - OutsideAirTempF
  - TypeName
  - Version

additionalProperties: false

x-gridworks:
  owner: "gridworks-energy"
