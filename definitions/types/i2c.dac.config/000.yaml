$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/i2c.dac.config/000"

title: "i2c.dac.config"
type: object
description: >
  Configuration of one named digital-to-analog converter on a GridWorks SCADA board.

properties:

  DacName:
    $ref: "https://schemas.electricity.works/formats/pascal.case"
    description: >
      The name of this DAC on the board.

  I2cBus:
    $ref: "https://schemas.electricity.works/formats/pascal.case"
    description: >
      The name of the board bus this DAC is attached to.

  I2cAddress:
    $ref: "https://schemas.electricity.works/formats/non.negative.int"
    description: >
      The I²C bus address of the DAC.

  DacType:
    $ref: "https://schemas.electricity.works/enums/i2c.dac.type/000"
    description: >
      The DAC model.

  Channels:
    $ref: "https://schemas.electricity.works/formats/positive.int"
    description: >
      The number of channels the DAC provides.

  TypeName:
    const: "i2c.dac.config"

  Version:
    const: "000"

required:
  - DacName
  - I2cBus
  - I2cAddress
  - DacType
  - Channels
  - TypeName
  - Version

additionalProperties: false

x-gridworks:
  owner: "gridworks-energy"
