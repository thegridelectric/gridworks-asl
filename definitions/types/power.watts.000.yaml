$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/schemas/power.watts/000"

title: "power.watts"
description: |
  Real-time power measurement for immediate transmission. This message is 
  designed for fire-and-forget delivery of instantaneous power readings from 
  GNodes (grid nodes), including importantly SCADAs but also aggregated 
  transactive nodes.
  
  Sign convention: Positive values indicate power WITHDRAWAL from the grid 
  (consumption), while negative values indicate power INJECTION to the grid 
  (generation).
  
  Delivery semantics: Send immediately without buffering. Do NOT persist or 
  retry.
type: object
required:
  - Watts
  - TypeName
  - Version
properties:
  Watts:
    type: integer
    description: |
      Instantaneous power in watts. Positive = consuming from grid, 
      negative = generating to grid.
  TypeName:
    type: string
    const: "power.watts"
    description: Type identifier
  Version:
    type: string
    const: "000"
    description: Version identifier

additionalProperties: false
x-gridworks:
  owner: "gridworks-energy"
  delivery: "fire-and-forget"
  replaces: "power.watts"
  notes: |
    Unlike snapshot events, power.watts messages are ephemeral. Sending 
    old power data is worse than sending nothing.
