$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/ads.channel.config/000"

title: "ads.channel.config"
type: object
description: >
  Channel configuration for one thermistor input read through an ADS111x ADC terminal block.

  This type spells out the base channel-configuration fields together with the ADS terminal
  block index, the thermistor device type, and an optional data-processing method.

properties:
  ChannelName:
    $ref: "https://schemas.electricity.works/formats/spaceheat.name"

  PollPeriodMs:
    $ref: "https://schemas.electricity.works/formats/positive.int"
    description: >
      How often SCADA polls the underlying hardware device or source for a
      fresh value, in milliseconds.

  CapturePeriodS:
    $ref: "https://schemas.electricity.works/formats/positive.int"
    description: >
      How often SCADA reports or emits the channel value into the telemetry
      stream, in seconds.

  AsyncCapture:
    type: boolean

  AsyncCaptureDelta:
    $ref: "https://schemas.electricity.works/formats/positive.int"
    description: >
      Optional threshold for asynchronous emission, expressed in Unit-scaled
      values.

  Exponent:
    type: integer
    description: >
      Base-10 scaling exponent applied to the serialized integer reading in
      combination with Unit.

  Unit:
    $ref: "https://schemas.electricity.works/enums/spaceheat.unit/001"

  TerminalBlockIdx:
    $ref: "https://schemas.electricity.works/formats/positive.int"
    description: >
      Which ADS terminal block this channel reads.

  ThermistorDeviceType:
    $ref: "https://schemas.electricity.works/formats/pascal.case"
    description: >
      The thermistor device, an open `pascal.case` string (a `gw1.device.type` value,
      e.g. `TewaThermistor` or `Amphenol10kThermistor`). The hardware layout enforces
      membership in `gw1.device.type`.

  DataProcessingMethod:
    $ref: "https://schemas.electricity.works/enums/thermistor.data.method/000"
    description: >
      Optional method for converting raw voltage to temperature.

  DataProcessingDescription:
    type: string
    description: >
      Optional free-text note about the data-processing configuration.

  TypeName:
    const: "ads.channel.config"

  Version:
    const: "000"

required:
  - ChannelName
  - CapturePeriodS
  - AsyncCapture
  - Exponent
  - Unit
  - TerminalBlockIdx
  - ThermistorDeviceType
  - TypeName
  - Version

additionalProperties: false

examples:
  - |
    {
      "ChannelName": "scada",
      "CapturePeriodS": 1,
      "AsyncCapture": false,
      "Exponent": 0,
      "Unit": "Unknown",
      "TerminalBlockIdx": 1,
      "ThermistorDeviceType": "MakeModel",
      "TypeName": "ads.channel.config",
      "Version": "000"
    }

x-gridworks:
  owner: "gridworks-energy"

  axioms:
    - number: 1
      name: "CaptureAndPollingConsistency"
      statement: >
        If PollPeriodMs exists, then CapturePeriodMs (CapturePeriodS * 1000) must be
        larger than PollPeriodMs. If CapturePeriodMs is less than 10 * PollPeriodMs,
        then CapturePeriodMs must be a multiple of PollPeriodMs.
