$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/g.node.cmd.nack/000"

title: "g.node.cmd.nack"
type: object
description: >
  The Grid Node Registry's reply to a write command it REFUSED, carrying the
  reason. Sent direct to the command's sender; success or refusal is
  discriminated by the reply's TypeName (the success twin is
  g.node.cmd.ack), never by inspecting a field. Because the reply rides the
  bus, the ear's capture makes every refusal a first-class audit record with
  its reason attached — a command in the capture with a nack is the registry
  saying no, out loud.

properties:

  CommandHash:
    type: string
    description: >
      The content hash of the refused command, as computed by the registry's
      append-only command log over the command's serialized bytes. Opaque to
      this contract (the hashing scheme is registry-internal); a sender
      correlates by comparing it to the hash of the bytes it published.

  Reason:
    type: string
    description: >
      The registry's human-readable refusal reason, verbatim from the
      refusing check (e.g. "parent 'hw1.isone.me.versant.keene' of
      'hw1.isone.me.versant.keene.beech' not found — create parents first").

  TypeName:
    const: "g.node.cmd.nack"

  Version:
    const: "000"

required:
  - CommandHash
  - Reason
  - TypeName
  - Version

additionalProperties: false

examples:
  - |
    {
      "CommandHash": "9c4d2f0e6a1b3c5d7e9f0a2b4c6d8e0f1a3b5c7d9e0f2a4b6c8d0e1f3a5b7c9d",
      "Reason": "parent 'hw1.isone.me.versant.keene' of 'hw1.isone.me.versant.keene.beech' not found — create parents first",
      "TypeName": "g.node.cmd.nack",
      "Version": "000"
    }

x-gridworks:
  owner: "gridworks-energy"
