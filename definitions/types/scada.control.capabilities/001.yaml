$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/scada.control.capabilities/001"

title: "scada.control.capabilities"
type: object
description: >
  Projection of the control surface exposed by a SCADA node.
  This type declares controllable relay and DAC nodes, the telemetry
  channels that represent their observed state, and the relay semantic
  configuration required for dispatch construction.

  This is a control-focused projection derived from layout.lite and does
  not represent the full system topology.

properties:

  FromGNodeAlias:
    $ref: "https://schemas.electricity.works/formats/left.right.dot"
    description: >
      GNode alias of the SCADA actor publishing this capability projection.

  MessageCreatedMs:
    $ref: "https://schemas.electricity.works/formats/utc.milliseconds"
    description: >
      Timestamp at which this projection was created.

  RelayNodes:
    type: array
    description: >
      List of Spaceheat nodes representing controllable relays exposed by
      this SCADA. Each node is dispatch-addressable by Name.
    items:
      $ref: "https://schemas.electricity.works/types/spaceheat.node.gt/302"

  DacNodes:
    type: array
    description: >
      List of Spaceheat nodes representing controllable 0-10V outputs exposed
      by this SCADA. Each node is dispatch-addressable by Name.
    items:
      $ref: "https://schemas.electricity.works/types/spaceheat.node.gt/302"

  ControlChannels:
    type: array
    description: >
      Data channels corresponding to controllable nodes. Each channel's
      AboutNodeName identifies the RelayNodes or DacNodes entry whose observed
      state is represented by the channel.
    items:
      $ref: "https://schemas.electricity.works/types/data.channel.gt/003"

  I2cRelayComponent:
    $ref: "https://schemas.electricity.works/types/i2c.multichannel.dt.relay.component.gt/004"
    description: >
      Relay semantic configuration component providing event and state
      mappings required for relay dispatch construction.

  TypeName:
    const: "scada.control.capabilities"

  Version:
    const: "001"

required:
  - FromGNodeAlias
  - MessageCreatedMs
  - RelayNodes
  - DacNodes
  - ControlChannels
  - I2cRelayComponent
  - TypeName
  - Version

additionalProperties: false

examples:
  - |
    {
      "FromGNodeAlias": "hw1.isone.me.versant.keene.beech.scada",
      "MessageCreatedMs": 1719340800000,
      "RelayNodes": [
        {
          "Name": "relay1",
          "ActorHierarchyName": "s.relay1",
          "Handle": "auto.pico-cycler.relay1",
          "ActorClass": "Relay",
          "DisplayName": "5VDC Relay",
          "ComponentId": "25f344ee-39ea-4904-bff9-54f2022337af",
          "ShNodeId": "a7f4becc-8e35-4118-a3e9-ab6ad13f5a67",
          "TypeName": "spaceheat.node.gt",
          "Version": "302"
        }
      ],
      "DacNodes": [],
      "ControlChannels": [
        {
          "Name": "vdc-relay1",
          "DisplayName": "5VDC Relay1 State",
          "AboutNodeName": "relay1",
          "CapturedByNodeName": "relay1",
          "TelemetryName": "RelayState",
          "Quantity": "Unitless",
          "TerminalAssetAlias": "hw1.isone.me.versant.keene.beech.ta",
          "Id": "9c33d7af-59e0-415b-8208-ecf64916a64b",
          "TypeName": "data.channel.gt",
          "Version": "003"
        }
      ],
      "I2cRelayComponent": {
        "ComponentId": "25f344ee-39ea-4904-bff9-54f2022337af",
        "DeviceType": "KridaDoubleRelayBoard16",
        "ConfigList": [
          {
            "ActorName": "relay1",
            "ChannelName": "vdc-relay1",
            "DeEnergizedState": "RelayClosed",
            "DeEnergizingEvent": "CloseRelay",
            "EnergizedState": "RelayOpen",
            "EnergizingEvent": "OpenRelay",
