$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/i2c.thermistor.reader.component.gt/003"

title: "i2c.thermistor.reader.component.gt"
type: object
description: >
  Configuration for an I2C thermistor reader component that samples one board-resident
  ADC and publishes one or more thermistor-backed temperature channels. Board-generic:
  the ADC is identified by `AdcName`, resolved against the thermistor-interface
  capability entries of the scada board's `gw1.scada.device.type.gt` record, which
  carries the physical facts (bus, address, reference volts, series resistance). The
  component carries only identity, channel configs, and the temperature calculation
  method. Flat — the shared component fields are spelled out here.

properties:
  ComponentId:
    $ref: "https://schemas.electricity.works/formats/uuid4.str"

  DeviceType:
    $ref: "https://schemas.electricity.works/formats/pascal.case"
    description: >
      The device category this component is built on, an open `pascal.case`
      string (a `gw1.device.type` value, e.g. Gw108Adc). The hardware layout
      enforces membership in `gw1.device.type`.

  ConfigList:
    type: array
    items:
      $ref: "https://schemas.electricity.works/types/i2c.thermistor.channel.config/002"
    description: >
      Thermistor channel configurations attached to this ADC reader.

  DisplayName:
    type: string

  HwUid:
    type: string

  AdcName:
    $ref: "https://schemas.electricity.works/formats/pascal.case"
    description: >
      The name of the board ADC this reader samples — the `Name` of a
      thermistor-interface capability entry in the board's
      `gw1.scada.device.type.gt` record (its `ThermistorAdcs`).

  TempCalcMethod:
    $ref: "https://schemas.electricity.works/enums/temp.calc.method/000"

  TypeName:
    const: "i2c.thermistor.reader.component.gt"

  Version:
    const: "003"

required:
  - ComponentId
  - DeviceType
  - ConfigList
  - AdcName
  - TempCalcMethod
  - TypeName
  - Version

additionalProperties: false

examples:
  - |
    {
      "ComponentId": "8879f861-add7-4b45-a200-1c2e29c49fdf",
      "DeviceType": "Gw108Adc",
      "ConfigList": [
        {
          "ChannelName": "scada",
          "AdcChannel": "P0",
          "SendToDerived": false,
          "ThermistorBeta": 1,
          "TypeName": "i2c.thermistor.channel.config",
          "Version": "002"
        }
      ],
      "AdcName": "Thermistors",
      "TempCalcMethod": "SimpleBeta",
      "TypeName": "i2c.thermistor.reader.component.gt",
      "Version": "003"
    }
x-gridworks:
  owner: "gridworks-energy"
  axioms:
    - number: 1
      name: "ChannelNameUniqueness"
      statement: >
        Channel names SHALL be unique across the ConfigList.
  extended_description: >
    The `.gt` suffix declares that this type is coupled bijectively with a table in
    a canonical seed database (here, the terminalasset registry): the table's rows are
    instances of this type. Sema is the authority over what a row means; the seed
    table is the authority over which instances are currently asserted.
