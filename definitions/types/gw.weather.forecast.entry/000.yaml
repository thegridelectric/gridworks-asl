$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/gw.weather.forecast.entry/000"

title: "gw.weather.forecast.entry"
type: object
description: >
  One channel's slice values within a gw.weather.forecast message. The
  wire carries no per-slice times: slice start times derive from
  FirstSliceStart plus the cumulative sum of the channel record's
  SliceDurationSList, and the number of values equals the record's
  declared TotalSlices — consumers read the structure from the
  gw.weather.forecast.channel.gt record, which the message does not
  carry.

properties:
  ChannelName:
    $ref: "https://schemas.electricity.works/formats/left.right.dot"
    description: >
      The gw.weather.forecast.channel.gt Name these values belong to.

  FirstSliceStart:
    $ref: "https://schemas.electricity.works/formats/utc.iso8601.seconds"
    description: >
      Start of the first forecast slice.

  Values:
    type: array
    items:
      type: integer
    description: >
      One integer value per slice, in slice order, scaled per the
      target channel record's Unit.

  TypeName:
    const: "gw.weather.forecast.entry"

  Version:
    const: "000"

required:
  - ChannelName
  - FirstSliceStart
  - Values
  - TypeName
  - Version

additionalProperties: false

examples:
  - |
    {
      "ChannelName": "us.me.millinocket.temperature.forecast.nws",
      "FirstSliceStart": "2026-08-11T15:00:00Z",
      "Values": [5150, 5080],
      "TypeName": "gw.weather.forecast.entry",
      "Version": "000"
    }

x-gridworks:
  owner: "gridworks-energy"

  axioms:
    - number: 1
      name: "NonEmptyValues"
      statement: >
        Values SHALL be non-empty.
