x-gridworks:
  owner: "gridworks-energy"
  extended_description: >
    A LeafTransactiveNode builds a flo.params.house0 each market slot to drive
    its Forward Looking Optimization. FLO models the home's heat pump and
    thermal storage over HorizonHours, searches for the lowest-cost operating
    plan against the price and weather forecasts, and from that plan derives
    the price-quantity curve the node submits as its market bid.

    The parameters fall into groups: identity and timing (GNodeAlias,
    FloParamsUid, TimezoneStr, StartUnixS, ParamsGeneratedS); horizon and
    storage geometry (HorizonHours, NumLayers, StorageVolumeGallons,
    StorageLossesPercent); heat pump characteristics (HpMinElecKw, HpMaxElecKw,
    HpTurnOnMinutes, HpIsOff, and the Cop terms); the initial thermal state
    (InitialTopTempF, InitialBottomTempF, InitialThermocline,
    BufferAvailableKwh, HouseAvailableKwh); the forecasts and their provenance
    ids; and the House0 thermal-response coefficients and operating points
    (Alpha/Beta/Gamma, the Intermediate and Dd fields, MaxEwtF). Several
    coefficients are carried as scaled integers to keep the serialized contract
    free of floating point representation.

    Version 001 models thermal storage as two temperature bands split by a
    single InitialThermocline. It carries neither FloAlias nor FloGitCommit
    (those arrive in version 002); version 003 later replaced the two-band
    model with a three-cluster model (InitialMiddleTempF and two thermoclines).

    Version 001 was emitted in four shapes over its wire life (Jan–Mar 2025),
    because the scada model grew fields without a version bump — a deploy-lag
    union where different houses picked up each change on different days: the
    birth shape (2025-01-20) lacked BufferAvailableKwh, HouseAvailableKwh,
    InitialBottomTempF and DischargingDdDeltaTF; BufferAvailableKwh and
    HouseAvailableKwh were added 2025-01-20; InitialBottomTempF became a stable
    field 2025-02-11; and DischargingDdDeltaTF (the "Hinge" model) was added
    2025-02-25 and carried through the end of version 001 traffic on 2025-03-24.
    So those four fields are each optional; the remaining base fields stay
    required.
