x-gridworks:
  owner: "gridworks-energy"
  extended_description: >
    A LeafTransactiveNode builds a flo.params.house0 each market slot to drive
    its Forward Looking Optimization. FLO models the home's heat pump and
    thermal storage over HorizonHours, searches for the lowest-cost operating
    plan against the price and weather forecasts, and from that plan derives
    the price-quantity curve the node submits as its market bid.

    The parameters fall into groups: identity and timing (GNodeAlias,
    FloParamsUid, TimezoneStr, StartUnixS, ParamsGeneratedS, FloAlias,
    FloGitCommit); horizon and storage geometry (HorizonHours, NumLayers,
    StorageVolumeGallons, StorageLossesPercent); heat pump characteristics
    (HpMinElecKw, HpMaxElecKw, HpTurnOnMinutes, HpIsOff, and the Cop terms);
    the initial thermal state (InitialTopTempF, InitialBottomTempF,
    InitialThermocline, BufferAvailableKwh, HouseAvailableKwh); the forecasts
    and their provenance ids; and the House0 thermal-response coefficients and
    operating points (Alpha/Beta/Gamma, the Intermediate and Dd fields,
    MaxEwtF). Several coefficients are carried as scaled integers to keep the
    serialized contract free of floating point representation.

    Version 002 models thermal storage as two temperature bands split by a
    single InitialThermocline. Version 003 replaced this with a three-cluster
    model (InitialTopTempF, InitialMiddleTempF, InitialBottomTempF and two
    thermoclines).

    Version 002 was emitted in three shapes over its wire life, because the
    scada model changed shape without a version bump (a deploy-lag union):
    (A) with DischargingDdDeltaTF and without FloAlias/FloGitCommit (the
    "Hinge" model, seen late Feb 2025); (B) a brief transition carrying all
    three (25–26 Mar 2025); (C) with FloAlias/FloGitCommit and without
    DischargingDdDeltaTF (the "Winter.Oak" FLO variant, from 25 Mar 2025
    onward, after the Hinge model was removed). All three share a common base
    of the remaining fields, so DischargingDdDeltaTF, FloAlias and FloGitCommit
    are each optional and the base fields stay required.
