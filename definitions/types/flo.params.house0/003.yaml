$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/flo.params.house0/003"

title: "flo.params.house0"
type: object
description: >
  Parameters into the Forward-Looking-Optimization (FLO) algorithm for
  a House0 thermal model.

properties:

  GNodeAlias:
    $ref: "https://schemas.electricity.works/formats/left.right.dot"

  FloParamsUid:
    $ref: "https://schemas.electricity.works/formats/uuid4.str"

  TimezoneStr:
    type: string

  StartUnixS:
    $ref: "https://schemas.electricity.works/formats/utc.seconds"

  NumLayers:
    $ref: "https://schemas.electricity.works/formats/positive.int"

  HorizonHours:
    $ref: "https://schemas.electricity.works/formats/positive.int"

  StorageVolumeGallons:
    $ref: "https://schemas.electricity.works/formats/positive.int"

  StorageLossesPercent:
    type: number

  HpMinElecKw:
    type: number

  HpMaxElecKw:
    type: number

  BufferAvailableKwh:
    type: number

  HouseAvailableKwh:
    type: number

  CopIntercept:
    type: number

  CopOatCoeff:
    type: number

  CopMin:
    type: number

  CopMinOatF:
    type: number

  CopLwtCoeff:
    type: number

  InitialTopTempF:
    type: integer

  InitialMiddleTempF:
    type: integer

  InitialBottomTempF:
    type: integer

  HpIsOff:
    type: boolean

  HpTurnOnMinutes:
    type: integer

  LmpForecast:
    type: array
    items:
      type: number

  InitialThermocline1:
    type: integer

  InitialThermocline2:
    type: integer

  DistPriceForecast:
    type: array
    items:
      type: number

  RegPriceForecast:
    type: array
    items:
      type: number

  PriceForecastUid:
    $ref: "https://schemas.electricity.works/formats/uuid4.str"

  OatForecastF:
    type: array
    items:
      type: number

  WindSpeedForecastMph:
    type: array
    items:
      type: number

  WeatherUid:
    $ref: "https://schemas.electricity.works/formats/uuid4.str"

  AlphaTimes10:
    type: integer

  BetaTimes100:
    type: integer

  GammaEx6:
    type: integer

  IntermediatePowerKw:
    type: number

  IntermediateRswtF:
    type: integer

  DdPowerKw:
    type: number

  DdRswtF:
    type: integer

  DdDeltaTF:
    type: integer

  MaxEwtF:
    type: integer

  PriceUnit:
    $ref: "https://schemas.electricity.works/enums/market.price.unit/000"

  ParamsGeneratedS:
    $ref: "https://schemas.electricity.works/formats/utc.seconds"

  FloAlias:
    type: string

  FloGitCommit:
    type: string

  TypeName:
    const: "flo.params.house0"

  Version:
    const: "003"

required:
  - GNodeAlias
  - FloParamsUid
  - TimezoneStr
  - StartUnixS
  - NumLayers
  - HorizonHours
  - StorageVolumeGallons
  - StorageLossesPercent
  - HpMinElecKw
  - HpMaxElecKw
  - BufferAvailableKwh
  - HouseAvailableKwh
  - CopIntercept
  - CopOatCoeff
  - CopMin
  - CopMinOatF
  - CopLwtCoeff
  - InitialTopTempF
  - InitialMiddleTempF
  - InitialBottomTempF
  - HpIsOff
  - HpTurnOnMinutes
  - InitialThermocline1
  - InitialThermocline2
  - PriceForecastUid
  - WeatherUid
  - AlphaTimes10
  - BetaTimes100
  - GammaEx6
  - IntermediatePowerKw
  - IntermediateRswtF
  - DdPowerKw
  - DdRswtF
  - DdDeltaTF
  - MaxEwtF
  - PriceUnit
  - ParamsGeneratedS
  - TypeName
  - Version

additionalProperties: false

x-gridworks:
  owner: "gridworks-energy"
