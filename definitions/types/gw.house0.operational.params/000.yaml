$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/gw.house0.operational.params/000"

title: "gw.house0.operational.params"
type: object
description: >
  Operational and optimization parameters for one House0-fleet home — the tunable
  state that changes without rewiring hardware. The third SCADA artifact alongside
  deployment config and the static hardware layout. Pairs with a gw.house0.layout
  artifact; the consumer resolves and decodes the ops artifact through the
  layout's family, so a mismatched pair fails at decode.

  Carries the per-channel capture/report tuning (CaptureTuningList) and the
  control and optimization parameters: the actuation authority and service
  mode (authority dominates: ServiceMode is inert unless ActuationAuthority
  is Active), the seasonal-storage mode, whether the Siegenthaler loop is
  actively controlled, the COP and heating curves, the
  heat-pump cycling and load-estimation knobs, and the FLO horizon.

properties:
  ScadaAlias:
    $ref: "https://schemas.electricity.works/formats/left.right.dot"
    description: >
      The alias of the Scada GNode that applies these params, making a stored
      or emitted instance self-identifying. The layout is the registry of
      record for the full GNode; the consumer checks this alias names the
      paired layout's Scada.

  CaptureTuningList:
    type: array
    items:
      $ref: "https://schemas.electricity.works/types/capture.tuning/000"
    description: >
      Per-channel capture/report tuning, one entry per captured channel.

  ActuationAuthority:
    $ref: "https://schemas.electricity.works/enums/gw1.actuation.authority/000"
    description: >
      The degree of physical actuation authority SCADA exercises. Authority
      dominates: ServiceMode is inert unless ActuationAuthority is Active.

  ServiceMode:
    $ref: "https://schemas.electricity.works/enums/gw1.service.mode/000"
    description: >
      The thermal service provided while ActuationAuthority is Active;
      inert otherwise.

  SeasonalStorageMode:
    $ref: "https://schemas.electricity.works/enums/gw1.seasonal.storage.mode/000"
    description: >
      Which thermal stores participate in the current season's operation.

  UseSiegLoop:
    type: boolean
    description: >
      True if the scada actively controls the Siegenthaler loop (runs the
      SiegLoop and HpBoss actors); false leaves both dormant.

  CopCurve:
    $ref: "https://schemas.electricity.works/types/cop.curve/000"
    description: >
      The heat pump's coefficient-of-performance model.

  HeatingCurve:
    $ref: "https://schemas.electricity.works/types/heating.curve/000"
    description: >
      The house's thermal / required-source-water-temperature model.

  HpTurnOnMinutes:
    $ref: "https://schemas.electricity.works/formats/positive.int"
    description: >
      Minutes the heat pump takes to reach steady output after turn-on.

  HpMaxKwEl:
    $ref: "https://schemas.electricity.works/formats/positive.float"
    description: >
      The heat pump's maximum electrical draw, in kW.

  ShortCycleBuffer:
    type: boolean
    description: >
      Whether to protect the heat pump from short cycling by buffering
      turn-off decisions.

  LoadOverestimationPercent:
    $ref: "https://schemas.electricity.works/formats/non.negative.int"
    description: >
      Percentage by which forecast heat load is deliberately overestimated.

  OilBoilerBackup:
    type: boolean
    description: >
      Whether the home has an oil boiler available as backup heat.

  HorizonHours:
    $ref: "https://schemas.electricity.works/formats/positive.int"
    description: >
      The FLO optimization horizon, in hours.

  OnPeakWindows:
    type: array
    items:
      $ref: "https://schemas.electricity.works/types/gw.tou.window/000"
    description: >
      The recurring on-peak windows during which the heat pump is held off.
      Each window names the days it binds; a day no window names runs
      unconstrained.

  TypeName:
    const: "gw.house0.operational.params"

  Version:
    const: "000"

required:
  - ScadaAlias
  - CaptureTuningList
  - ActuationAuthority
  - ServiceMode
  - SeasonalStorageMode
  - UseSiegLoop
  - CopCurve
  - HeatingCurve
  - HpTurnOnMinutes
  - HpMaxKwEl
  - ShortCycleBuffer
  - LoadOverestimationPercent
  - OilBoilerBackup
  - HorizonHours
  - OnPeakWindows
  - TypeName
  - Version

additionalProperties: false

examples:
  - |
    {
      "ScadaAlias": "hw1.isone.me.versant.keene.beech.scada",
      "CaptureTuningList": [
        {
          "ChannelName": "dist-swt",
          "CapturePeriodS": 300,
          "AsyncCapture": true,
          "AsyncCaptureDelta": 250,
          "TypeName": "capture.tuning",
          "Version": "000"
        }
      ],
      "ActuationAuthority": "Active",
      "ServiceMode": "Heating",
      "SeasonalStorageMode": "AllTanks",
      "UseSiegLoop": true,
      "CopCurve": {
        "Intercept": 1.02,
        "OatCoeff": 0.0257,
        "LwtCoeff": 0,
        "Min": 1.4,
        "MinOatF": 15,
        "TypeName": "cop.curve",
        "Version": "000"
      },
      "HeatingCurve": {
        "AlphaTimes10": 55,
        "BetaTimes100": -10,
        "GammaEx6": 0,
        "IntermediatePowerKw": 1.5,
        "IntermediateRswtF": 100,
        "DdPowerKw": 5.5,
        "DdRswtF": 150,
        "DdDeltaTF": 20,
        "MaxEwtF": 170,
        "TypeName": "heating.curve",
        "Version": "000"
      },
      "HpTurnOnMinutes": 12,
      "HpMaxKwEl": 9.66,
      "ShortCycleBuffer": false,
      "LoadOverestimationPercent": 0,
      "OilBoilerBackup": true,
      "HorizonHours": 48,
      "OnPeakWindows": [
        {
          "Start": "07:00",
          "End": "12:00",
          "Days": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
          "TypeName": "gw.tou.window",
          "Version": "000"
        }
      ],
      "TypeName": "gw.house0.operational.params",
      "Version": "000"
    }

x-gridworks:
  owner: "gridworks-energy"

  axioms:
    - number: 1
      name: "CaptureTuningChannelUniqueness"
      statement: >
        ChannelName SHALL be unique across CaptureTuningList.

    - number: 2
      name: "PerDayWindowNonOverlap"
      statement: >
        For each day of the week, the windows in OnPeakWindows whose Days
        include that day SHALL NOT overlap one another.

  extended_description: >
    operational-params is the authored home for the tunable state that left the static
    hardware layout and the deployment config in hardware-layout-pass-one: what changes
    without rewiring hardware — the per-channel capture params (CapturePeriodS,
    AsyncCapture, AsyncCaptureDelta, PollPeriodMs), the operating modes, the COP and
    heating curves, and the optimization knobs. Home identity (the GNodes) lives in
    the layout. The assembly step merges this artifact with the static layout to
    build the runtime layout the device actors read, so moving these params here does
    not change what the actors see.
