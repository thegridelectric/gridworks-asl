x-gridworks:
  owner: "gridworks-energy"

  axioms:
    - number: 1
      name: "CaptureTuningChannelUniqueness"
      statement: >
        ChannelName SHALL be unique across CaptureTuningList.

  extended_description: >
    The home is identified by its three GNodes, and the distinction among them is
    load-bearing — it is a common point of confusion, so it is spelled out here:

      - TerminalAsset: the physical transactive asset itself — the heat pump plus
        thermal storage located behind the atomic metered point. It is the *thing*
        that consumes power and is metered. Its alias ends in `.ta`.
      - Scada: the GNode responsible for local telemetry, data acquisition, and
        control *of* that TerminalAsset. It is the *controller*, not the asset. Its
        alias ends in `.scada`. This is why TerminalAsset and Scada are separate
        GNodes and are NOT interchangeable: one is the asset, the other is the
        control system acting on it. These operational params are applied by the
        Scada, but they describe how the TerminalAsset is operated.
      - LeafTransactiveNode: the atomic metered unit that participates in markets and
        enters Dispatch Contracts on behalf of the TerminalAsset (exactly one per
        TerminalAsset). It is the *market / metering boundary*; it is the parent
        alias of both the TerminalAsset and the Scada.

    operational-params is the authored home for the tunable state that left the static
    hardware layout and the deployment config in hardware-layout-pass-one: what changes
    without rewiring hardware — the per-channel capture params (CapturePeriodS,
    AsyncCapture, AsyncCaptureDelta, PollPeriodMs), the operating modes, the COP and
    heating curves, and the optimization knobs. It mirrors the layout's GNodes identity
    so the two pair unambiguously. The assembly step
    (ops_and_sema_to_dc) merges this artifact with the static layout to build the
    runtime dc HardwareLayout the device actors read, so moving these params here does
    not change what the actors see.
