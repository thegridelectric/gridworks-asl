$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/gw.house0.operational.params/000"

title: "gw.house0.operational.params"
type: object
description: >
  Operational and optimization parameters for one House0-fleet home — the tunable
  state that changes without rewiring hardware. The third SCADA artifact alongside
  deployment config and the static hardware layout, which it pairs with by GNodes.

  Carries the per-channel capture/report tuning (CaptureTuningList) and the
  control and optimization parameters: system and seasonal-storage modes, the
  COP and heating curves, the heat-pump cycling and load-estimation knobs, the
  FLO horizon, and the home's location.

properties:
  GNodes:
    type: array
    items:
      $ref: "https://schemas.electricity.works/types/g.node.gt/006"
    description: >
      The home's three Grid Node identities — its LeafTransactiveNode, TerminalAsset,
      and Scada — the same set the hardware layout carries, which pairs this artifact
      with its layout. The three are distinct roles, not duplicates; see
      extended_description for how they relate and why the TerminalAsset and the Scada
      are different GNodes.

  CaptureTuningList:
    type: array
    items:
      $ref: "https://schemas.electricity.works/types/capture.tuning/000"
    description: >
      Per-channel capture/report tuning, one entry per captured channel.

  SystemMode:
    $ref: "https://schemas.electricity.works/enums/gw1.system.mode/000"
    description: >
      The overall operating mode of the heating system.

  SeasonalStorageMode:
    $ref: "https://schemas.electricity.works/enums/gw1.seasonal.storage.mode/000"
    description: >
      Which thermal stores participate in the current season's operation.

  CopCurve:
    $ref: "https://schemas.electricity.works/types/cop.curve/000"
    description: >
      The heat pump's coefficient-of-performance model.

  HeatingCurve:
    $ref: "https://schemas.electricity.works/types/heating.curve/000"
    description: >
      The house's thermal / required-source-water-temperature model.

  HpTurnOnMinutes:
    $ref: "https://schemas.electricity.works/formats/positive.int"
    description: >
      Minutes the heat pump takes to reach steady output after turn-on.

  ShortCycleBuffer:
    type: boolean
    description: >
      Whether to protect the heat pump from short cycling by buffering
      turn-off decisions.

  LoadOverestimationPercent:
    $ref: "https://schemas.electricity.works/formats/non.negative.int"
    description: >
      Percentage by which forecast heat load is deliberately overestimated.

  OilBoilerBackup:
    type: boolean
    description: >
      Whether the home has an oil boiler available as backup heat.

  HorizonHours:
    $ref: "https://schemas.electricity.works/formats/positive.int"
    description: >
      The FLO optimization horizon, in hours.

  Latitude:
    type: number
    description: >
      The home's latitude, in decimal degrees.

  Longitude:
    type: number
    description: >
      The home's longitude, in decimal degrees.

  TypeName:
    const: "gw.house0.operational.params"

  Version:
    const: "000"

required:
  - GNodes
  - CaptureTuningList
  - SystemMode
  - SeasonalStorageMode
  - CopCurve
  - HeatingCurve
  - HpTurnOnMinutes
  - ShortCycleBuffer
  - LoadOverestimationPercent
  - OilBoilerBackup
  - HorizonHours
  - Latitude
  - Longitude
  - TypeName
  - Version

additionalProperties: false

