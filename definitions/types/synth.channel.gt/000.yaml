$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/synth.channel.gt/000"

title: "synth.channel.gt"
type: object
description: >
  Definition of a synthetic telemetry channel computed by a GridWorks actor
  node from one or more input channels using a declared strategy.

properties:

  Id:
    $ref: "https://schemas.electricity.works/formats/uuid4.str"

  Name:
    $ref: "https://schemas.electricity.works/formats/spaceheat.name"

  CreatedByNodeName:
    $ref: "https://schemas.electricity.works/formats/spaceheat.name"

  TelemetryName:
    $ref: "https://schemas.electricity.works/enums/spaceheat.telemetry.name/007"

  TerminalAssetAlias:
    $ref: "https://schemas.electricity.works/formats/left.right.dot"

  Strategy:
    type: string

  DisplayName:
    type: string

  SyncReportMinutes:
    $ref: "https://schemas.electricity.works/formats/positive.int"

  TypeName:
    const: "synth.channel.gt"

  Version:
    const: "000"

required:
  - Id
  - Name
  - CreatedByNodeName
  - TelemetryName
  - TerminalAssetAlias
  - Strategy
  - DisplayName
  - SyncReportMinutes
  - TypeName
  - Version

additionalProperties: false

x-gridworks:
  owner: "gridworks-energy"
