$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/gw.weather.observation/000"

title: "gw.weather.observation"
type: object
description: >
  One station observation: the values of one or more observed weather
  channels at ObservationTime. The claim is archive-honest — the
  station observed these values at that time — whenever Interpolated
  is false; publication lateness is provenance, not part of the claim.
  Gap recovery replays ordinary observation messages, one per missed
  grid point, with fabricated fills marked Interpolated. A missing
  quantity is an omitted reading, not an optional field; a new
  quantity is a new channel and list entry, no type churn.

properties:
  ObservationTime:
    $ref: "https://schemas.electricity.works/formats/utc.iso8601.seconds"
    description: >
      When the station observed these values. Never the publication
      time.

  Interpolated:
    type: boolean
    description: >
      True when the values are fabricated — interpolated between the
      bracketing real observations during gap recovery. False for
      every real station observation, however late it arrives.

  Readings:
    type: array
    items:
      $ref: "https://schemas.electricity.works/types/gw.weather.reading/000"
    description: >
      One reading per observed channel at ObservationTime.

  TypeName:
    const: "gw.weather.observation"

  Version:
    const: "000"

required:
  - ObservationTime
  - Interpolated
  - Readings
  - TypeName
  - Version

additionalProperties: false

examples:
  - |
    {
      "ObservationTime": "2026-08-11T14:00:00Z",
      "Interpolated": false,
      "Readings": [
        {
          "ChannelName": "us.me.millinocket.temperature",
          "Value": 5180,
          "TypeName": "gw.weather.reading",
          "Version": "000"
        },
        {
          "ChannelName": "us.me.millinocket.windspeed",
          "Value": 4500,
          "TypeName": "gw.weather.reading",
          "Version": "000"
        }
      ],
      "TypeName": "gw.weather.observation",
      "Version": "000"
    }

x-gridworks:
  owner: "gridworks-energy"

  axioms:
    - number: 1
      name: "NonEmptyReadings"
      statement: >
        Readings SHALL be non-empty.
    - number: 2
      name: "ChannelUniqueness"
      statement: >
        No two elements of Readings SHALL share a ChannelName.
