$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/gw.weather.observation/000"

title: "gw.weather.observation"
type: object
description: >
  One station observation: the air temperature and wind speed observed
  at a location at ObservationTime, published by a GridWorks-run
  weather forecast service that ingests external weather services. The
  claim is archive-honest — the station observed these values at that
  time — whenever Interpolated is false; publication lateness is
  provenance, not part of the claim. Gap recovery replays ordinary
  observation messages, one per missed grid point, with fabricated
  fills marked Interpolated. Values are scaled integers per the
  channel records.

properties:
  LocationAlias:
    $ref: "https://schemas.electricity.works/formats/left.right.dot"
    description: >
      Alias of the gw.weather.location.gt this observation is about —
      the stream name consumers subscribe to for these broadcasts, and
      the join key to the location and channel records.

  ObservationTime:
    $ref: "https://schemas.electricity.works/formats/utc.iso8601.seconds"
    description: >
      When the station observed these values. Never the publication
      time.

  Interpolated:
    type: boolean
    description: >
      True when the values are fabricated — interpolated between the
      bracketing real observations during gap recovery. False for
      every real station observation, however late it arrives.

  TempChannelName:
    $ref: "https://schemas.electricity.works/formats/left.right.dot"
    description: >
      Name of the observed channel whose value rides TempValue.

  TempValue:
    type: integer
    description: >
      Observed air temperature, scaled per the channel's Unit.

  WindSpeedChannelName:
    $ref: "https://schemas.electricity.works/formats/left.right.dot"
    description: >
      Name of the observed channel whose value rides WindSpeedValue.

  WindSpeedValue:
    type: integer
    description: >
      Observed wind speed, scaled per the channel's Unit. Absent when
      the station reported no wind for this observation.

  TypeName:
    const: "gw.weather.observation"

  Version:
    const: "000"

required:
  - LocationAlias
  - ObservationTime
  - Interpolated
  - TempChannelName
  - TempValue
  - WindSpeedChannelName
  - TypeName
  - Version

additionalProperties: false

examples:
  - |
    {
      "LocationAlias": "us.me.millinocket",
      "ObservationTime": "2026-08-12T13:35:00Z",
      "Interpolated": false,
      "TempChannelName": "us.me.millinocket.temperature",
      "TempValue": 7268,
      "WindSpeedChannelName": "us.me.millinocket.windspeed",
      "WindSpeedValue": 4500,
      "TypeName": "gw.weather.observation",
      "Version": "000"
    }

x-gridworks:
  owner: "gridworks-energy"

  axioms:
    - number: 1
      name: "DistinctChannels"
      statement: >
        TempChannelName SHALL differ from WindSpeedChannelName.
    - number: 2
      name: "LocationNaming"
      statement: >
        a. TempChannelName SHALL begin with LocationAlias followed by
        ".".
        b. WindSpeedChannelName SHALL begin with LocationAlias
        followed by ".".

  extended_description: >
    Structure and units live on the observed-channel records
    (gw.weather.channel.gt); the weather forecast service ensures
    their consistency with the location record. A station observation
    that lacks wind omits WindSpeedValue — absence is absence, never a
    sentinel. Hard-coding the quantities mirrors gw.weather.forecast:
    the type is the fleet's observed-weather contract, and adding a
    quantity is a version bump. LocationAlias rides the payload
    because the routing key's radio channel does not survive archival;
    the archived message stays self-describing.
