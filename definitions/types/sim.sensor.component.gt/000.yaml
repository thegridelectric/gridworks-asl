$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/sim.sensor.component.gt/000"

title: "sim.sensor.component.gt"
type: object
description: >
  A simulated sensor component — the component a SimSensorActor uses in a simulated
  hardware layout. Structurally the generic component (id, cac, ConfigList), but a
  distinct `sim.*` type so a simulated layout is visibly simulated by construction:
  simulated things MUST use `sim.*` component types rather than reusing real ones.
  Flat — every field spelled out here.

properties:

  ComponentId:
    $ref: "https://schemas.electricity.works/formats/uuid4.str"

  ComponentAttributeClassId:
    $ref: "https://schemas.electricity.works/formats/uuid4.str"

  ConfigList:
    type: array
    items:
      $ref: "https://schemas.electricity.works/types/channel.config/000"
    description: >
      Channel configurations the simulated sensor publishes.

  DisplayName:
    type: string

  HwUid:
    type: string

  TypeName:
    const: "sim.sensor.component.gt"

  Version:
    const: "000"

required:
  - ComponentId
  - ComponentAttributeClassId
  - ConfigList
  - TypeName
  - Version

additionalProperties: false

x-gridworks:
  owner: "gridworks-energy"
