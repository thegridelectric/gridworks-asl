$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/sim.sensor.component.gt/000"

title: "sim.sensor.component.gt"
type: object
description: >
  A simulated sensor component — the component a SimSensorActor uses in a simulated
  hardware layout. Structurally the generic component (id, DeviceType, ConfigList), but
  a distinct `sim.*` type so a simulated layout is visibly simulated by construction:
  simulated things MUST use `sim.*` component types rather than reusing real ones.
  Flat — every field spelled out here.

properties:

  ComponentId:
    $ref: "https://schemas.electricity.works/formats/uuid4.str"

  DeviceType:
    $ref: "https://schemas.electricity.works/formats/pascal.case"
    description: >
      The device category this component is built on, an open `pascal.case` string
      (a `gw1.device.type` value, normally `GridworksSimSensor`). The hardware layout
      enforces membership in `gw1.device.type`.

  ConfigList:
    type: array
    items:
      $ref: "https://schemas.electricity.works/types/channel.config/000"
    description: >
      Channel configurations the simulated sensor publishes.

  DisplayName:
    type: string

  HwUid:
    type: string

  TypeName:
    const: "sim.sensor.component.gt"

  Version:
    const: "000"

required:
  - ComponentId
  - DeviceType
  - ConfigList
  - TypeName
  - Version

additionalProperties: false

examples:
  - |
    {
      "ComponentId": "933106d7-d6d0-4044-8766-627fd8ecb71b",
      "DeviceType": "GridworksSimSensor",
      "ConfigList": [
        {
          "ChannelName": "scada",
          "CapturePeriodS": 1,
          "AsyncCapture": false,
          "Exponent": 0,
          "Unit": "Unknown",
          "TypeName": "channel.config",
          "Version": "000"
        }
      ],
      "TypeName": "sim.sensor.component.gt",
      "Version": "000"
    }

x-gridworks:
  owner: "gridworks-energy"
