$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/sim.relay.component.gt/000"

title: "sim.relay.component.gt"
type: object
description: >
  A simulated relay component — the component the scada-side SimRelayActor's relay
  node uses in a simulated hardware layout. Structurally a relay component (id,
  DeviceType, a ConfigList of relay actor config), but a distinct `sim.*` type so a
  simulated layout is visibly simulated by construction. Parallel to the simulated sensor component.
  Flat — every field spelled out here.

properties:

  ComponentId:
    $ref: "https://schemas.electricity.works/formats/uuid4.str"

  DeviceType:
    $ref: "https://schemas.electricity.works/formats/pascal.case"
    description: >
      The device category this component is built on, an open
      pascal-case string.

  ConfigList:
    type: array
    items:
      $ref: "https://schemas.electricity.works/types/relay.actor.config/003"
    description: >
      Relay actor configurations the simulated relay bank manages.

  DisplayName:
    type: string

  HwUid:
    type: string

  TypeName:
    const: "sim.relay.component.gt"

  Version:
    const: "000"

required:
  - ComponentId
  - DeviceType
  - ConfigList
  - TypeName
  - Version

additionalProperties: false

examples:
  - |
    {
      "ComponentId": "d6c555ab-d5c7-4aa1-8f02-eaf5f7598f10",
      "DeviceType": "GridworksSimRelayBank",
      "ConfigList": [
        {
          "ChannelName": "scada",
          "RelayIdx": 1,
          "ActorName": "scada",
          "WiringConfig": "NormallyClosed",
          "EventType": "beech.1",
          "DeEnergizingEvent": "a",
          "EnergizingEvent": "a",
          "StateType": "beech.1",
          "DeEnergizedState": "a",
          "EnergizedState": "a",
          "TypeName": "relay.actor.config",
          "Version": "003"
        }
      ],
      "TypeName": "sim.relay.component.gt",
      "Version": "000"
    }
x-gridworks:
  owner: "gridworks-energy"
  axioms:
    - number: 1
      name: "ChannelNameUniqueness"
      statement: >
        Channel names SHALL be unique across the ConfigList.
  extended_description: >
    The `.gt` suffix declares that this type is coupled bijectively with a table in
    a canonical seed database (here, the terminalasset registry): the table's rows are
    instances of this type. Sema is the authority over what a row means; the seed
    table is the authority over which instances are currently asserted.

    DeviceType values come from the `gw1.device.type` vocabulary; the hardware layout enforces membership.

    The config entries are `relay.actor.config` records. Kin: `sim.sensor.component.gt`.
