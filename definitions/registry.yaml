        direct_dependencies:
          structural:
            - "left.right.dot"
            - "market.price.unit:000"
            - "market.quantity.unit:000"
            - "market.slot.name"
            - "price.quantity.unitless:001"

  channel.config:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Base configuration for a component telemetry channel, including sampling cadence, async reporting, scaling exponent, and serialized unit."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/channel.config/000"
        created: "2024-09-22T11:32:00Z"
        summary: "Initial Sema version"
        direct_dependencies:
          structural:
            - "positive.int"
            - "spaceheat.name"
            - "spaceheat.unit:001"

  channel.readings:
    latest_version: "002"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Timestamped integer readings for one channel within a SCADA reporting context."

    versions:
      "002":
        schema_url: "https://schemas.electricity.works/types/channel.readings/002"
        created: "2024-10-12T17:43:44Z"
        summary: >-
          - ChannelId: remove
          - additionalProperties: true -> false
        direct_dependencies:
          structural:
            - "spaceheat.name"
            - "utc.milliseconds"
      "001":
        schema_url: "https://schemas.electricity.works/types/channel.readings/001"
        created: "2024-10-06T17:49:32Z"
        summary: "Baseline runtime version (no prior version tracked)."
        direct_dependencies:
          structural:
            - "spaceheat.name"
            - "utc.milliseconds"
            - "uuid4.str"

  channel.readings.list.item:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Channel-specific readings and unit metadata for one entry in a synchronized readings bundle."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/channel.readings.list.item/000"
        created: "2026-05-05T00:00:00Z"
        summary: "Initial Sema version"
        direct_dependencies:
          structural:
            - "left.right.dot"
            - "spaceheat.name"

  connectivity.edge.gt:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Directed topological edge connecting two Grid Nodes in the physical electric network"

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/connectivity.edge.gt/000"
        created: "2026-02-23T00:00:00Z"
        summary: "Initial Sema version"
        direct_dependencies:
          structural:
            - "g.node.status:000"
            - "left.right.dot"
            - "uuid4.str"

  data.channel.gt:
    latest_version: "002"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Canonical definition of a telemetry channel representing directly captured measurements"

    versions:

      "002":
        schema_url: "https://schemas.electricity.works/types/data.channel.gt/002"
        created: "2026-03-30T21:27:05Z"
        summary: >-
          - Quantity: add
          - TelemetryName: spaceheat.telemetry.name:006 -> 007
          - TelemetryQuantityConsistency axiom: add
        direct_dependencies:
          structural:
            - "gw1.quantity:000"
            - "left.right.dot"
            - "spaceheat.name"
            - "spaceheat.telemetry.name:007"
            - "utc.seconds"
            - "uuid4.str"
          axiom:
            - "spaceheat.telemetry.quantity.projection:000"

      "001":
        schema_url: "https://schemas.electricity.works/types/data.channel.gt/001"
        created: "2025-09-24T14:29:00Z"
        summary: "Baseline runtime version (no prior version tracked)."
        direct_dependencies:
          structural:
            - "left.right.dot"
            - "spaceheat.name"
            - "spaceheat.telemetry.name:006"
            - "utc.seconds"
            - "uuid4.str"

  derived.channel.gt:
    latest_version: "002"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Canonical definition of computed telemetry channels within a GridWorks system."

    versions:
      "002":
        schema_url: "https://schemas.electricity.works/types/derived.channel.gt/002"
        created: "2026-03-04T19:00:00Z"
        summary: >-
          - OutputUnit: required
          - OutputQuantity: add
          - OutputUnitQuantityConsistency axiom: add
        direct_dependencies:
          structural:
            - "gw1.emission.method:000"
            - "gw1.quantity:000"
            - "gw1.unit:000"
            - "left.right.dot"
            - "positive.int"
            - "spaceheat.name"
            - "uuid4.str"
          axiom:
            - "gw1.unit.quantity.projection:000"

      "001":
        schema_url: "https://schemas.electricity.works/types/derived.channel.gt/001"
        created: "2026-02-02T23:00:00Z"
        summary: >-
          - InputChannelNames[]: add
          - EmissionMethod: add
          - Parameters: add (Optional)
        direct_dependencies:
          structural:
            - "gw1.emission.method:000"
            - "gw1.unit:000"
            - "left.right.dot"
            - "positive.int"
            - "spaceheat.name"
            - "uuid4.str"

      "000":
        schema_url: "https://schemas.electricity.works/types/derived.channel.gt/000"
        created: "2026-01-03T14:27:00Z"
        summary: "Initial Sema version"
        direct_dependencies:
          structural:
            - "gw1.unit:000"
            - "left.right.dot"
            - "spaceheat.name"
            - "uuid4.str"

