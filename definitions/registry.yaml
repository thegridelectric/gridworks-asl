types:

  analytics.channel.gt:
    latest_version: "000"
    owner: joe-strommen
    versioning_strategy: "literal"
    description: "Canonical definition of a computed telemetry channel scoped to a single terminal asset and produced outside SCADA systems."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/draft/types/analytics.channel.gt/000"
        created: "2026-04-02T00:00:00Z"
        summary: "Initial Sema version"
        status: "draft"
        direct_dependencies:
          structural:
            - "gw1.quantity:000"
            - "gw1.unit:001"
            - "left.right.dot"
            - "spaceheat.name"
            - "uuid4.str"
          axiom:
            - "gw1.unit.quantity.projection:000"

  bid:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
