[project]
name = "sema"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jessica Millar", email = "jessica.lynn.millar@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.13",
    "gridworks>=1.4.2",
    "pydantic>=2.11.7",
    "pyyaml>=6.0.2",
    "uvicorn>=0.34.3",
]

[project.scripts]
sema = "sema.interfaces.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sema"]

[dependency-groups]
dev = [
    "ipython>=9.12.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.14",
    "mypy>=1.16.1",
    "pytest>=8.4.1",
    "ruff>=0.12.0",
]
