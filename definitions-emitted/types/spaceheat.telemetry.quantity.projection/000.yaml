$schema: https://json-schema.org/draft/2020-12/schema
$id: https://schemas.electricity.works/types/spaceheat.telemetry.quantity.projection/000
title: spaceheat.telemetry.quantity.projection
type: object
description: 'Canonical projection from spaceheat.telemetry.name to gw1.quantity. This type defines the authoritative dimensional abstraction associated with each telemetry semantic category in version 007 of spaceheat.telemetry.name.

  This projection exists to make dimensional semantics explicit at the serialization boundary and to support safe evolution toward gw1.unit.

  '
properties:
  TelemetryName:
    $ref: https://schemas.electricity.works/enums/spaceheat.telemetry.name/007
  Quantity:
    $ref: https://schemas.electricity.works/enums/gw1.quantity/000
  TypeName:
    const: spaceheat.telemetry.quantity.projection
  Version:
    const: '000'
required:
- TelemetryName
- Quantity
- TypeName
- Version
additionalProperties: false
x-gridworks:
  owner: gridworks-energy
  axioms:
  - number: 1
    name: EnumeratedProjectionMapping
    statement: "The only valid TelemetryName → Quantity pairs in version 000 are:\n\n  Unknown → Unknown\n\n  PowerW → Power\n  WattHours → Energy\n  MilliWattHours → Energy\n\n  WaterTempCTimes1000 → Temperature\n  WaterTempFTimes1000 → Temperature\n  AirTempCTimes1000 → Temperature\n  AirTempFTimes1000 → Temperature\n  CelsiusTimes100 → Temperature\n\n  GpmTimes100 → FlowRate\n  GallonsTimes100 → Volume\n\n  VoltageRmsMilliVolts → Voltage\n  VoltsTimesTen → Voltage\n  VoltsTimes100 → Voltage\n  MicroVolts → Voltage\n\n  CurrentRmsMicroAmps → Current\n\n  HzTimes100 → Frequency\n  MicroHz → Frequency\n\n  RelayState → Unitless\n  ThermostatState → Unitless\n  StorageLayer → Unitless\n  BinaryState → Unitless\n\n  PercentKeep → Percent\n\nAny other combination SHALL be invalid.\n"
