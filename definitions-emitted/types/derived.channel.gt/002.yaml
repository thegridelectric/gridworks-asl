$schema: https://json-schema.org/draft/2020-12/schema
$id: https://schemas.electricity.works/types/derived.channel.gt/002
title: derived.channel.gt
type: object
description: 'Canonical definition of a derived telemetry channel within a GridWorks system.

  A derived.channel.gt declares a computed telemetry stream whose values are produced from one or more input channels according to a declared strategy. Derived channels do not represent directly captured measurements; instead, they represent transformations, aggregations, or computations over other telemetry streams.

  '
properties:
  Id:
    $ref: https://schemas.electricity.works/formats/uuid4.str
    description: 'Globally unique identifier for this derived channel definition.

      '
  Name:
    $ref: https://schemas.electricity.works/formats/spaceheat.name
    description: 'Short identifier of the derived channel within the terminal asset or SCADA context.

      '
  CreatedByNodeName:
    $ref: https://schemas.electricity.works/formats/spaceheat.name
    description: 'Name of the node responsible for computing this derived channel.

      '
  Strategy:
    $ref: https://schemas.electricity.works/formats/spaceheat.name
    description: 'Identifier of the computation strategy used to produce this channel.

      '
  InputChannelNames:
    type: array
    items:
      $ref: https://schemas.electricity.works/formats/spaceheat.name
    description: 'Names of input channels consumed by the computation strategy.

      '
  OutputUnit:
    $ref: https://schemas.electricity.works/enums/gw1.unit/000
    description: 'Measurement unit of the derived output values.

      '
  OutputQuantity:
    $ref: https://schemas.electricity.works/enums/gw1.quantity/000
    description: 'Canonical physical dimension of the derived output. OutputQuantity SHALL equal the quantity defined by the canonical gw1.unit.quantity.projection/000 instance for the specified OutputUnit.

      '
  EmissionMethod:
    $ref: https://schemas.electricity.works/enums/gw1.emission.method/000
    description: 'Defines how and when derived values are emitted (e.g., OnTrigger, Periodic, AsyncAndPeriodic).

      '
  AsyncEmitDelta:
    type: integer
    description: 'Minimum delta required to emit asynchronously. Required for AsyncAndPeriodic. Must not be present for OnTrigger or Periodic.

      '
    minimum: 1
  EmitPeriodS:
    type: integer
    description: 'Periodic emission interval in seconds. Required for Periodic and AsyncAndPeriodic. Must not be present for OnTrigger.

      '
    minimum: 1
  Parameters:
    type: object
    additionalProperties: true
    description: 'Optional strategy-specific configuration parameters.

      '
  DisplayName:
    type: string
    description: 'Human-readable name for display and UI purposes.

      '
  TerminalAssetAlias:
    $ref: https://schemas.electricity.works/formats/left.right.dot
    description: 'Canonical alias of the terminal asset within which this derived channel exists.

      '
  TypeName:
    const: derived.channel.gt
  Version:
    const: '002'
required:
- Id
- Name
- CreatedByNodeName
- Strategy
- InputChannelNames
- OutputUnit
- OutputQuantity
- EmissionMethod
- DisplayName
- TerminalAssetAlias
- TypeName
- Version
additionalProperties: false
examples:
- "{\n  \"CreatedByNodeName\": \"derived-generator\",\n  \"DisplayName\": \"Required Energy Wh\",\n  \"Id\": \"26c5f643-96cc-4ede-b958-75d626790c01\",\n  \"Name\": \"required-energy\",\n  \"OutputUnit\": \"WattHours\"\n  \"OutputQuantity\": \"Energy\",\n  \"Strategy\": \"system-model\",\n  \"EmissionMethod\": \"Periodic\",\n  \"EmitPeriodS\": 60,\n  \"InputChannelNames\": [],\n  \"Parameters\": {\n    \"EnergyModel\": {\n      \"TypeName\": \"gw0.required.energy.layered\",\n      \"Version\": \"000\"\n    }\n  },\n  \"TerminalAssetAlias\": \"d1.isone.ct.newhaven.orange1.ta\",\n  \"TypeName\": \"derived.channel.gt\",\n  \"Version\": \"002\"\n}"
x-gridworks:
  owner: gridworks-energy
  axioms:
  - number: 1
    name: EmissionSemanticsConsistency
    statement: "EmissionMethod SHALL determine the presence of EmitPeriodS and AsyncEmitDelta as follows:\n\n  OnTrigger → neither EmitPeriodS nor AsyncEmitDelta present\n  Periodic → EmitPeriodS present, AsyncEmitDelta absent\n  AsyncAndPeriodic → both EmitPeriodS and AsyncEmitDelta present\n"
  - number: 2
    name: OutputUnitQuantityConsistency
    statement: 'OutputQuantity SHALL equal the Quantity defined by the canonical gw1.unit.quantity.projection:000 instance for the specified OutputUnit.

      '
  - number: 3
    name: AffineStrategyRequiresCalibration
    statement: "If Strategy equals \"affine\", then:\n\n  - Parameters SHALL contain a key \"Calibration\".\n  - Parameters.Calibration SHALL be a valid\n    linear.one.dimensional.calibration instance.\n"
  - number: 4
    name: SystemModelRequiresParameters
    statement: "If Strategy equals \"system-model\", then:\n  - Parameters SHALL be present.\n  - Parameters SHALL contain a key \"EnergyModel\".\n  - Parameters.EnergyModel SHALL include:\n      - TypeName\n      - Version\n"
  extended_description: '`derived.channel.gt` defines computed telemetry channels produced from other telemetry streams. These channels represent transformations, aggregations, or model-based computations rather than directly observed measurements.

    Telemetry values associated with `derived.channel.gt` are intended to be represented as integers, with any required scaling encoded in the OutputUnit.

    This convention supports deterministic and efficient serialization while preserving mechanical interpretability of values. Alternative representations (e.g., floating point values) are expected to be introduced through separate vocabularies rather than modifying the semantics of `derived.channel.gt`.

    Instances of `channel.readings` referencing a derived channel SHALL be interpreted by resolving ChannelName against `derived.channel.gt`.Name within the relevant terminal asset / SCADA context.

    Together, `data.channel.gt` and `derived.channel.gt` form the semantic backbone for telemetry reporting. `channel.readings` transports values, and `report` aggregates those readings for transmission from SCADA nodes.'
