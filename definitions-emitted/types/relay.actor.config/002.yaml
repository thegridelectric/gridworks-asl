$schema: https://json-schema.org/draft/2020-12/schema
$id: https://schemas.electricity.works/types/relay.actor.config/002
title: relay.actor.config
type: object
description: 'Configuration for a relay-backed Spaceheat actor associated with one relay on a multi-channel relay board.

  A relay.actor.config binds a specific relay index on a relay component to a named actor and declares the event/state semantics associated with energizing and de-energizing that relay. The config also carries the channel capture settings required to report the relay-controlled actor''s state into the telemetry system.

  '
properties:
  ChannelName:
    $ref: https://schemas.electricity.works/formats/spaceheat.name
    description: 'Name of the telemetry channel associated with this relay actor.

      '
  PollPeriodMs:
    $ref: https://schemas.electricity.works/formats/positive.int
    description: 'Polling period in milliseconds used to check the relay state.

      '
  CapturePeriodS:
    $ref: https://schemas.electricity.works/formats/positive.int
    description: 'Period in seconds for periodic capture of the relay state channel.

      '
  AsyncCapture:
    type: boolean
    description: 'If true, state changes SHALL be captured asynchronously in addition to periodic capture.

      '
  AsyncCaptureDelta:
    $ref: https://schemas.electricity.works/formats/positive.int
    description: 'Minimum change required to trigger asynchronous capture. For relay-backed state channels this is typically 1.

      '
  Exponent:
    type: integer
    description: 'Base-10 exponent applied to the channel value representation.

      '
  Unit:
    $ref: https://schemas.electricity.works/enums/spaceheat.unit/001
    description: 'Unit associated with the channel represented by this relay actor config.

      '
  RelayIdx:
    $ref: https://schemas.electricity.works/formats/positive.int
    description: 'One-based relay index on the associated relay board component.

      '
  ActorName:
    $ref: https://schemas.electricity.works/formats/spaceheat.name
    description: 'Canonical Spaceheat node name of the actor controlled by this relay.

      '
  WiringConfig:
    $ref: https://schemas.electricity.works/enums/relay.wiring.config/000
    description: 'Wiring configuration of the relay contact arrangement used by this actor.

      '
  EventType:
    $ref: https://schemas.electricity.works/formats/left.right.dot
    description: 'Semantic event category emitted when the relay changes the controlled actor''s state.

      '
  DeEnergizingEvent:
    type: string
    description: 'Event value associated with transition caused by relay de-energization.

      '
    minLength: 1
  EnergizingEvent:
    type: string
    description: 'Event value associated with transition caused by relay energization.

      '
    minLength: 1
  StateType:
    $ref: https://schemas.electricity.works/formats/left.right.dot
    description: 'Semantic state category controlled by this relay.

      '
  DeEnergizedState:
    type: string
    description: 'State value associated with the de-energized relay position.

      '
    minLength: 1
  EnergizedState:
    type: string
    description: 'State value associated with the energized relay position.

      '
    minLength: 1
  TypeName:
    const: relay.actor.config
  Version:
    const: '002'
required:
- ChannelName
- CapturePeriodS
- AsyncCapture
- Exponent
- Unit
- RelayIdx
- ActorName
- WiringConfig
- EventType
- DeEnergizingEvent
- EnergizingEvent
- StateType
- DeEnergizedState
- EnergizedState
- TypeName
- Version
additionalProperties: false
examples:
- "{\n  \"ActorName\": \"relay17\",\n  \"AsyncCapture\": true,\n  \"CapturePeriodS\": 300,\n  \"ChannelName\": \"zone1-down-failsafe-relay17\",\n  \"DeEnergizedState\": \"WallThermostat\",\n  \"DeEnergizingEvent\": \"SwitchToWallThermostat\",\n  \"EnergizedState\": \"Scada\",\n  \"EnergizingEvent\": \"SwitchToScada\",\n  \"EventType\": \"change.heatcall.source\",\n  \"Exponent\": 0,\n  \"PollPeriodMs\": 200,\n  \"RelayIdx\": 17,\n  \"WiringConfig\": \"DoubleThrow\"\n  \"Unit\": \"Unitless\",\n  \"StateType\": \"heatcall.source\",\n  \"TypeName\": \"relay.actor.config\",\n  \"Version\": \"002\",\n}"
x-gridworks:
  owner: gridworks-energy
  axioms:
  - number: 1
    name: EventEnumConsistency
    statement: 'If EventType names a known enum, then DeEnergizingEvent and EnergizingEvent SHALL both be valid values of that enum.

      '
  - number: 2
    name: StateEnumConsistency
    statement: 'If StateType names a known enum, then DeEnergizedState and EnergizedState SHALL both be valid values of that enum.

      '
  - number: 3
    name: EventStateSemanticMatch
    statement: 'EnergizingEvent and DeEnergizingEvent SHALL correspond semantically to transitions into EnergizedState and DeEnergizedState respectively.

      '
  - number: 4
    name: ClosedOpenWiringConsistency
    statement: "If:\n\n  - StateType equals \"relay.closed.or.open\"\n  - EventType equals \"change.relay.state\"\n  - WiringConfig equals \"NormallyClosed\"\n\nthen:\n\n  - DeEnergizedState SHALL equal \"RelayClosed\"\n  - DeEnergizingEvent SHALL equal \"CloseRelay\"\n  - EnergizedState SHALL equal \"RelayOpen\"\n  - EnergizingEvent SHALL equal \"OpenRelay\"\n\nIf:\n\n  - StateType equals \"relay.closed.or.open\"\n  - EventType equals \"change.relay.state\"\n  - WiringConfig equals \"NormallyOpen\"\n\nthen:\n\n  - DeEnergizedState SHALL equal \"RelayOpen\"\n  - DeEnergizingEvent SHALL equal \"OpenRelay\"\n  - EnergizedState SHALL equal \"RelayClosed\"\n  - EnergizingEvent SHALL equal \"CloseRelay\"\n"
  extended_description: 'relay.actor.config specializes generic channel capture configuration for relay-backed actors in hydronic control systems.

    This type binds one relay position on a relay board to a specific actor and declares the event/state semantics associated with switching that relay. These semantics are important for distributed coordination because different layouts may realize the same functional role using different underlying hardware node names, while preserving identical actor-level meaning.

    Typical uses include selecting the source of a heat call, enabling or disabling control authority, or switching physical flow or heating elements between named operating states.

    '
