$schema: https://json-schema.org/draft/2020-12/schema
$id: https://schemas.electricity.works/enums/buffer.regulation.mode/000
title: buffer.regulation.mode
type: string
description: 'Governs how the House0 buffer tank is operated.

  '
enum:
- Normal
- Tight
default: Normal
x-gridworks:
  owner: gridworks-energy
  version: '000'
  value_descriptions:
    Normal: 'Normal mode uses the full range of the buffer thermal store. Charging begins when the buffer is declared empty, as determined by the lowest available buffer temperature sensor dropping below a threshold temperature. The buffer is declared full when the highest buffer temperature sensor rises above a threshold temperature. Thresholds are derived from required source water temperature calculations that account for house performance and weather forecasts.

      '
    Tight: 'Tight mode keeps the buffer within a narrowly regulated temperature band, permitting frequent charge and discharge transitions to maintain relatively constant buffer energy. Heat pump short-cycling is prevented by alternating between charging the buffer and the store.

      '
