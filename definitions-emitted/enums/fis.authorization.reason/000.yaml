$schema: https://json-schema.org/draft/2020-12/schema
$id: https://schemas.electricity.works/enums/fis.authorization.reason/000
title: fis.authorization.reason
type: string
description: 'Structured reason describing why the Fleet Index Service (FIS) produced a specific authorization decision.

  Reasons provide audit-level diagnostic clarity and are machine-readable.

  '
enum:
- NewInstance
- IdempotentReconnect
- SupersededPrevious
- MalformedRequest
- UnknownGNode
- InactiveGNode
- AliasMismatch
- ClassMismatch
- InstanceRevoked
- SecurityViolation
default: SecurityViolation
x-gridworks:
  owner: jessica-millar
  version: '000'
