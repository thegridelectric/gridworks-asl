$schema: https://json-schema.org/draft/2020-12/schema
$id: https://schemas.electricity.works/enums/relay.open.or.closed/000
title: relay.open.or.closed
type: string
description: "Binary state of a single-pole relay contact. Describes whether the relay \ncontact is open (not conducting) or closed (conducting), regardless of \ncoil energization state.\n\nNote 1: The coil energization required to achieve a contact state depends \non relay type:\n- Normally Open (NO) relay: energized coil → closed contact\n- Normally Closed (NC) relay: de-energized coil → closed contact\n\nNote 2: This enum is specifically for single-pole relays with binary states.\nOther relay configurations (double-throw, multi-position, latching, etc.) \nrequire different state enumerations that capture their specific switching \npatterns.\n"
enum:
- RelayClosed
- RelayOpen
default: RelayClosed
x-gridworks:
  owner: gridworks-energy
  version: '000'
  value_descriptions:
    RelayClosed: Relay contact is closed (conducting)
    RelayOpen: Relay contact is open (not conducting)
