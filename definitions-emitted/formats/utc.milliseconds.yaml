$schema: https://json-schema.org/draft/2020-12/schema
$id: https://schemas.electricity.works/formats/utc.milliseconds
title: utc.milliseconds
description: 'UTC timestamp expressed as whole milliseconds since the Unix epoch

  (1970-01-01T00:00:00Z). Value is restricted to the range

  2000-01-01T00:00:00Z through 3000-01-01T00:00:00Z.

  '
examples:
- '1609459200000'
- '1609459200500'
- '1735689600123'
counterexamples:
- '0'
- '946684799999'
- '32503680000001'
- '1609459200000.5'
x-gridworks:
  owner: gridworks-energy
minimum: 946684800000
maximum: 32503680000000
