$schema: https://json-schema.org/draft/2020-12/schema
$id: https://schemas.electricity.works/formats/utc.seconds
title: utc.seconds
description: 'UTC timestamp expressed as whole seconds since the Unix epoch

  (1970-01-01T00:00:00Z). Value is restricted to the range

  2000-01-01T00:00:00Z through 3000-01-01T00:00:00Z.

  '
type: integer
examples:
- 1609459200
- 1735689600
counterexamples:
- 0
- 946684799
- 32503680001
- 1609459200.5
